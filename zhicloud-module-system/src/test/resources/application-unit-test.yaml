--- #################### 智云相关配置 ####################

# 智云配置项，设置当前项目所有自定义的配置
zhicloud:
  info:
    base-package: cn.zhicloud.module
  audit-log: # 审计日志相关配置项（单元测试中禁用，避免文件系统副作用）
    hash-chain:
      enabled: false
    independent-storage:
      enabled: false
      path: logs/audit
