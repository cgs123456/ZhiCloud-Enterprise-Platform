# Source: zhicloud/templates/job-migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: zhicloud-migration
  namespace: zhicloud-dev
  labels:
    helm.sh/chart: zhicloud-1.0.0
    app.kubernetes.io/name: zhicloud
    app.kubernetes.io/instance: zhicloud
    app: zhicloud-server
    component: backend
    app.kubernetes.io/version: "2026.06.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # ArgoCD Sync Hook：在主资源 Sync 前执行
    argocd.argoproj.io/hook: PreSync
    # 删除策略：每次创建新 Hook 前删除旧 Job（保证幂等）
    argocd.argoproj.io/hook-delete-policy: before-hook-creation
    # 失败时是否跳过后续 Sync：返回非 0 即失败
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 失败重试次数
  backoffLimit: 2
  # 完成后保留时长（秒），便于排查
  ttlSecondsAfterFinished: 600
  # 串行化：只允许一个 Pod、只需一次成功完成，杜绝并发迁移
  completions: 1
  parallelism: 1
  # 迁移超时上限，避免异常时长期占住 PreSync 阶段
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zhicloud
        app.kubernetes.io/instance: zhicloud
        app: zhicloud-server
        component: backend
        job-type: flyway-migration
    spec:
      # Never + backoffLimit：失败即产生新 Pod 便于保留失败现场日志，且失败会真实反映到 Job 状态
      restartPolicy: Never
      serviceAccountName: zhicloud
      securityContext:
        fsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
      containers:
        - name: flyway-migration
          image: zhicloud-server:2026.06.0-dev
          imagePullPolicy: IfNotPresent
          # 复用 ConfigMap/Secret 环境变量，保证数据库连接信息可用
          envFrom:
            - configMapRef:
                name: zhicloud-config
            - secretRef:
                name: zhicloud-app-secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: TZ
              value: "Asia/Shanghai"
            # existing=存量库增量迁移；clean=仅空 MySQL 库，显式覆盖后才允许
            - name: MIGRATION_BASELINE_MODE
              value: "existing"
          # 直接运行 fat jar 内的迁移入口类：只初始化 Flyway + JDBC，跑完即退出。
          # 迁移失败会以非 0 退出码结束，从而让 PreSync Hook 失败并阻断发布。
          command:
            - java
          args:
            - -XX:MaxRAMPercentage=75
            - -Duser.timezone=Asia/Shanghai
            - -Dloader.main=cn.zhicloud.server.DatabaseMigrationRunner
            - -cp
            - /zhicloud-server/app.jar
            - org.springframework.boot.loader.launch.PropertiesLauncher
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
          # 迁移 Job 与业务 Pod 使用同一 truststore 契约，避免 PreSync 阶段先失败
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
