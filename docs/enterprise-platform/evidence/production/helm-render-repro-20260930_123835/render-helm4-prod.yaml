# Source: zhicloud/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zhicloud
  namespace: zhicloud-prod
  labels:
    helm.sh/chart: zhicloud-1.0.0
    app.kubernetes.io/name: zhicloud
    app.kubernetes.io/instance: zhicloud
    app: zhicloud-server
    component: backend
    app.kubernetes.io/version: "2026.06.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zhicloud
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # 扩容策略：快速响应流量增长
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    # 缩容策略：缓慢释放资源，避免抖动
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

