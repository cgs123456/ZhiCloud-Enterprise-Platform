apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zhicloud
  namespace: zhicloud-prod
  labels:
    helm.sh/chart: zhicloud-1.0.0
    app.kubernetes.io/name: zhicloud
    app.kubernetes.io/instance: zhicloud
    app: zhicloud-server
    component: backend
    app.kubernetes.io/version: "2026.06.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/limit-connections: "200"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "api.zhicloud.example.com"
      secretName: "zhicloud-tls-secret"
  rules:
    - host: "api.zhicloud.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zhicloud
                port:
                  number: 48080
