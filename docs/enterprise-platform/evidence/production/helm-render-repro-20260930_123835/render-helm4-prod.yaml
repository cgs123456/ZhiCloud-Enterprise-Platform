# Source: zhicloud/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhicloud
  namespace: zhicloud-prod
  labels:
    helm.sh/chart: zhicloud-1.0.0
    app.kubernetes.io/name: zhicloud
    app.kubernetes.io/instance: zhicloud
    app: zhicloud-server
    component: backend
    app.kubernetes.io/version: "2026.06.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zhicloud
      app.kubernetes.io/instance: zhicloud
      app: zhicloud-server
      component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zhicloud
        app.kubernetes.io/instance: zhicloud
        app: zhicloud-server
        component: backend
      annotations:
        # 注入 ConfigMap/Secret 哈希，内容变更时自动滚动更新
        checksum/config: 8d5d9982da462c895e627df202c192368f4ed139ff845b603cf606c35aa678d2
        checksum/secret: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
        checksum/external-secret-revision: 2520d63f4c10069488f7074a0b8556cf971b25be14ec69a948134d4af6e89418
        checksum/mysql-tls-truststore-revision: 2520d63f4c10069488f7074a0b8556cf971b25be14ec69a948134d4af6e89418
    spec:
      # 优雅停机：保证 preStop + Spring graceful 总时长不超过该值
      terminationGracePeriodSeconds: 60
      serviceAccountName: zhicloud
      automountServiceAccountToken: true
      # Pod 级安全上下文
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: zhicloud-server
          image: zhicloud-server:2026.06.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 48080
              protocol: TCP
            - name: actuator
              containerPort: 48090
              protocol: TCP
          # envFrom：批量注入 ConfigMap/Secret 中的环境变量
          envFrom:
            - configMapRef:
                name: zhicloud-config
            - secretRef:
                name: zhicloud-app-secret
          # env：覆盖关键变量（优先级高于 envFrom）
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: TZ
              value: "Asia/Shanghai"
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx2g -XX:+UseZGC -XX:+ZGenerational -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom"
            # env 覆盖 envFrom：即使 ConfigMap 被误改，业务副本也不能取得自动迁移入口。
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: MYSQL_TLS_TRUSTSTORE_URL
              value: "file:/etc/zhicloud/mysql-tls/truststore.p12"
            - name: MYSQL_TLS_TRUSTSTORE_TYPE
              value: "PKCS12"
            - name: MYSQL_TLS_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "zhicloud-mysql-truststore"
                  key: "MYSQL_TLS_TRUSTSTORE_PASSWORD"
          # 健康检查
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /actuator/health/readiness
              port: 48090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /actuator/health/liveness
              port: 48090
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          # 资源配额
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          # 优雅停机：preStop 先等待流量摘除（Service endpoint 同步），再由
          # server.shutdown=graceful 处理进行中请求。不再调用 /actuator/shutdown——
          # 该端点默认未暴露（exposure 列表无 shutdown），curl 必然失败，此前等于只有 sleep 5。
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 10"
          # 容器级安全上下文
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
          # MySQL TLS truststore 只读挂载
          volumeMounts:
            - name: mysql-tls-truststore
              mountPath: "/etc/zhicloud/mysql-tls"
              readOnly: true
            - mountPath: /tmp
              name: tmp
      # 卷：MySQL TLS truststore + 额外卷
      volumes:
        - name: mysql-tls-truststore
          secret:
            secretName: "zhicloud-mysql-truststore"
            items:
              - key: "truststore.p12"
                path: "truststore.p12"
        - emptyDir: {}
          name: tmp
      # 调度策略
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - zhicloud-mysql
                  - zhicloud-redis
                  - zhicloud-postgres
              topologyKey: kubernetes.io/hostname
            weight: 100
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zhicloud
              app.kubernetes.io/instance: zhicloud
              app: zhicloud-server
              component: backend

