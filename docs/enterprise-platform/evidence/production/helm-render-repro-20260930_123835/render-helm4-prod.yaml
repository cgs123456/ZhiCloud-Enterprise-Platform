# Source: zhicloud/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: zhicloud-config
  namespace: zhicloud-prod
  labels:
    helm.sh/chart: zhicloud-1.0.0
    app.kubernetes.io/name: zhicloud
    app.kubernetes.io/instance: zhicloud
    app: zhicloud-server
    component: backend
    app.kubernetes.io/version: "2026.06.0"
    app.kubernetes.io/managed-by: Helm
data:
  # Spring profile（dev/staging/prod）
  SPRING_PROFILES_ACTIVE: "prod"
  # 时区
  TZ: "Asia/Shanghai"
  # JVM 参数
  JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseZGC -XX:+ZGenerational -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof -Djava.security.egd=file:/dev/./urandom"
  # 唯一迁移入口：Kubernetes 业务 Pod 禁止自行执行 Flyway；迁移由 PreSync Job 完成。
  SPRING_FLYWAY_ENABLED: "false"
  # ----- 主数据源（密码见 Secret）-----
  MASTER_DATASOURCE_URL: "jdbc:mysql://zhicloud-mysql-prod:3306/zhicloud_platform?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2,TLSv1.3&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true"
  MASTER_DATASOURCE_USERNAME: "zhicloud"
  # ----- 从数据源 -----
  SLAVE_DATASOURCE_URL: "jdbc:mysql://zhicloud-mysql-prod-slave:3306/zhicloud_platform?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2,TLSv1.3&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true"
  SLAVE_DATASOURCE_USERNAME: "zhicloud"
  # ----- Redis -----
  REDIS_HOST: "zhicloud-redis-prod"
  REDIS_PORT: "6379"
  # ----- RAG 数据源 -----
  ZHICLOUD_AIRAG_ENABLED: "true"
  ZHICLOUD_AIRAG_DATASOURCE_URL: "jdbc:postgresql://zhicloud-postgres-prod:5432/zhicloud_rag?sslmode=verify-full"
  ZHICLOUD_AIRAG_DATASOURCE_USERNAME: "zhicloud"
  ZHICLOUD_AIRAG_INITIALIZE_SCHEMA: "false"
  # ----- OTel 链路追踪 -----
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://zhicloud-jaeger-prod:4318/v1/traces"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://zhicloud-jaeger-prod:4318/v1/traces"

