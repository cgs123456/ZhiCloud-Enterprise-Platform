# ============================================================
# zhicloud-server ArgoCD Project
# 限制 Application 的目标 namespace 和 cluster，防止误部署
# - 仅允许部署到 zhicloud-dev / zhicloud-staging / zhicloud-prod 命名空间
# - 仅允许部署到 in-cluster
# - 允许的资源类型白名单
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zhicloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: zhicloud-server
    app.kubernetes.io/part-of: zhicloud-gitops
spec:
  # 项目描述
  description: zhicloud-server 单体应用 GitOps 项目（dev/staging/prod 多环境）

  # 来源仓库白名单（允许 Application 引用这些仓库）
  sourceRepos:
    - https://github.com/zhicloud/zhicloud-server.git
    # 私有仓库（如需）
    # - git@github.com:zhicloud/zhicloud-server.git

  # 目标集群 + namespace 白名单
  destinations:
    # dev 环境
    - server: https://kubernetes.default.svc
      namespace: zhicloud-dev
    # staging 环境
    - server: https://kubernetes.default.svc
      namespace: zhicloud-staging
    # prod 环境
    - server: https://kubernetes.default.svc
      namespace: zhicloud-prod
    # ArgoCD 自身（用于 Hook Job 落地）
    - server: https://kubernetes.default.svc
      namespace: argocd

  # 允许的资源类型白名单（防止部署高危资源）
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding

  # 允许的命名空间资源
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: batch
      kind: Job

  # 禁止的资源黑名单（双保险）
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange

  # 同步窗口（可选）：限制 prod 环境仅在工作时间部署
  syncWindows:
    - kind: allow
      schedule: '0 9 * * 1-5'
      duration: 12h
      applications:
        - zhicloud-server-prod
      namespaces:
        - zhicloud-prod
      clusters:
        - https://kubernetes.default.svc
      manualSync: true

  # 角色配置（可选）：CI/CD 服务账户
  roles:
    - name: ci-deployer
      description: CI/CD 流水线部署角色
      policies:
        - p, proj:zhicloud:ci-deployer, applications, sync, zhicloud/*, allow
      groups:
        - zhicloud-ci
