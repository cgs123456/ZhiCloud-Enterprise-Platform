# ============================================================
# zhicloud-server Helm Chart 默认配置（values.yaml）
# 所有配置项均可被 -f values-<env>.yaml 或 --set 覆盖
# 注释标注每项含义；占位符形式 ${ENV_VAR} 表示从环境/外部注入
# ============================================================

# ----- 全局 -----
global:
  # 镜像仓库地址前缀，留空表示使用本地/Docker Hub
  imageRegistry: ""
  # 镜像拉取 Secret 列表（私有仓库时配置）
  imagePullSecrets: []
  # 通用存储类，留空使用集群默认
  storageClass: ""

# ----- 镜像配置 -----
image:
  # 镜像仓库名（不含 tag）
  repository: zhicloud-server
  # 镜像 tag，与 Chart.appVersion 对齐
  tag: "2026.06.0"
  # 镜像拉取策略：Always/Never/IfNotPresent
  pullPolicy: IfNotPresent

# ----- 副本数（HPA 未生效时的初始副本，HPA 启用后由 HPA 接管）-----
replicaCount: 2

# ----- 镜像拉取 Secret（与 global.imagePullSecrets 二选一）-----
imagePullSecrets: []

# ----- ServiceAccount 配置 -----
serviceAccount:
  # 是否创建 ServiceAccount
  create: true
  # ServiceAccount 名称，留空则使用 fullname
  name: ""
  # 是否自动挂载 API token
  automount: true
  # 绑定的集群角色注解
  annotations: {}

# ----- Pod 安全上下文（Pod 级别）-----
podSecurityContext:
  # 以非 root 用户运行
  runAsNonRoot: true
  # 运行用户 UID（与 Dockerfile 中 zhicloud 用户对齐）
  runAsUser: 1000
  # 文件系统组 GID
  fsGroup: 1000

# ----- 容器安全上下文（Container 级别）-----
securityContext:
  # 禁止提权
  allowPrivilegeEscalation: false
  # 非 root 运行
  runAsNonRoot: true
  # 运行用户 UID
  runAsUser: 1000
  # 只读根文件系统（需配合可写 emptyDir 挂载 /tmp 等）
  readOnlyRootFilesystem: false
  # Linux 能力裁剪
  capabilities:
    drop:
      - ALL

# ----- Service 端口配置 -----
service:
  # Service 类型
  type: ClusterIP
  # HTTP 端口（业务流量）
  port: 48080
  # Actuator 端口（健康检查/监控）
  actuatorPort: 48090
  # 端口名（用于 Service mesh 等）
  portName: http
  actuatorPortName: actuator

# ----- 优雅停机配置 -----
# preStop 先调用 actuator/shutdown 触发 Spring Boot graceful shutdown
# terminationGracePeriodSeconds 保证总等待不超过设定值
terminationGracePeriodSeconds: 30

# ----- Ingress 配置 -----
ingress:
  # 是否启用 Ingress
  enabled: true
  # Ingress Controller 类名
  className: nginx
  # 域名占位符，部署时按环境替换
  host: "api.zhicloud.example.com"
  # TLS 配置
  tls:
    # 是否启用 TLS
    enabled: true
    # TLS 证书 Secret 名（需提前通过 cert-manager 或 kubectl 创建）
    secretName: "zhicloud-tls-secret"
  # Nginx Ingress 注解
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

# ----- 资源配额 -----
# requests 为调度保证值；limits 为硬上限
resources:
  requests:
    # CPU 请求（1 核 = 1000m）
    cpu: 250m
    # 内存请求
    memory: 512Mi
  limits:
    # CPU 上限
    cpu: 1000m
    # 内存上限
    memory: 2Gi

# ----- 水平自动伸缩（HPA）-----
hpa:
  # 是否启用 HPA
  enabled: true
  # 最小副本数
  minReplicas: 2
  # 最大副本数
  maxReplicas: 10
  # CPU 使用率阈值（百分比），超过则扩容
  targetCPUUtilizationPercentage: 75
  # 扩容冷却窗口（秒）
  scaleUpStabilizationWindowSeconds: 60
  # 缩容冷却窗口（秒）
  scaleDownStabilizationWindowSeconds: 300

# ----- 健康检查 -----
probes:
  # 存活探针：失败则重启容器
  liveness:
    enabled: true
    httpGet:
      path: /actuator/health/liveness
      port: 48090
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  # 就绪探针：失败则摘除流量
  readiness:
    enabled: true
    httpGet:
      path: /actuator/health/readiness
      port: 48090
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ----- 监控：Prometheus Operator ServiceMonitor -----
# 当集群已安装 Prometheus Operator 时，启用 ServiceMonitor CRD 自动抓取 actuator 指标
monitoring:
  serviceMonitor:
    # 是否创建 ServiceMonitor CRD（需集群已安装 Prometheus Operator）
    enabled: false
    # 抓取间隔
    interval: 30s
    # 抓取超时
    scrapeTimeout: 10s
    # 附加标签（用于 Prometheus 通过 labelSelector 选择 ServiceMonitor）
    additionalLabels: {}
# ----- MySQL TLS 证书信任库（生产必需）-----
# Connector/J 9.x 的 VERIFY_IDENTITY 会校验证书链与数据库主机名。
# 仅有 sslMode=REQUIRED/VERIFY_CA 不足；truststore 文件与密码必须由外部 Secret 提供。
mysqlTls:
  # true 时 Deployment 与 Flyway PreSync Job 都挂载 truststore 并注入连接属性
  enabled: true
  # 只允许生产使用 VERIFY_IDENTITY
  mode: "VERIFY_IDENTITY"
  truststore:
    # 专用 Secret 名称；生产必须显式设置，留空时 Helm 渲染失败
    existingSecret: ""
    # 外部 truststore Secret 的版本/指纹；existingSecret 非空时必须提供，轮换后更新以触发滚动更新。
    existingSecretRevision: ""
    # Secret 中 PKCS12/JKS 文件的 data key
    fileKey: "truststore.p12"
    # 挂载到容器后的文件名
    fileName: "truststore.p12"
    # Secret 中 truststore 密码的 key；应用仅通过 secretKeyRef 读取
    passwordKey: "MYSQL_TLS_TRUSTSTORE_PASSWORD"
    # PKCS12 或 JKS
    type: "PKCS12"
    # 容器内只读挂载目录
    mountPath: "/etc/zhicloud/mysql-tls"

# ----- 环境变量（非敏感，写入 ConfigMap）-----
# 数据库/Redis 等连接信息通过 ${ENV_VAR} 占位，DEV/STAGING/PROD 通过 values 覆盖注入
env:
  # Spring 激活 profile
  SPRING_PROFILES_ACTIVE: "prod"
  # 时区
  TZ: "Asia/Shanghai"
  # JVM 参数（容器感知堆：按 memory limit 60% 自动设上限，OOM 快速退出）
  JAVA_OPTS: "-XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -XX:+ZGenerational -Djava.security.egd=file:/dev/./urandom"
  # ----- 主数据源（rewriteBatchedStatements=true 开启 JDBC 批量重写，批量写入约 20 倍提升）-----
  MASTER_DATASOURCE_URL: "jdbc:mysql://zhicloud-mysql:3306/zhicloud_platform?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2,TLSv1.3&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true"
  # 最小权限：使用专用业务账号（需预先创建并授权）
  MASTER_DATASOURCE_USERNAME: "zhicloud"
  # ----- 从数据源 -----
  SLAVE_DATASOURCE_URL: "jdbc:mysql://zhicloud-mysql:3306/zhicloud_platform?sslMode=VERIFY_IDENTITY&tlsVersions=TLSv1.2,TLSv1.3&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true"
  SLAVE_DATASOURCE_USERNAME: "zhicloud"
  # ----- Redis -----
  REDIS_HOST: "zhicloud-redis"
  REDIS_PORT: "6379"
  # ----- RAG 数据源 -----
  ZHICLOUD_AIRAG_ENABLED: "true"
  ZHICLOUD_AIRAG_DATASOURCE_URL: "jdbc:postgresql://zhicloud-postgres:5432/zhicloud_rag"
  ZHICLOUD_AIRAG_DATASOURCE_USERNAME: "zhicloud"
  # 生产/默认路径禁止应用启动 DDL；表和索引由 sql/postgresql/airag_pgvector.sql 显式创建
  ZHICLOUD_AIRAG_INITIALIZE_SCHEMA: "false"
  # ----- OTel 链路追踪 -----
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://zhicloud-jaeger:4318/v1/traces"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://zhicloud-jaeger:4318/v1/traces"

# ----- 敏感配置 -----
# 安全约定：所有密钥默认留空，helm 渲染时会因空值直接失败（templates/_helpers.tpl 的 zhicloud.requiredSecret）。
# 这是刻意为之——历史上这些字段默认值全是占位符字符串（CHANGE_ME 前缀），
# helm install 不报错，导致「忘记改密码」可以一路进到生产而无人察觉。
#
# 推荐用法（按优先级）：
#   1) secrets.existingSecret: 指向 External Secrets Operator / Sealed Secrets 生成的 Secret，
#      此时 Chart 完全不渲染明文密钥，仓库里不存在任何密钥物料；
#   2) helm upgrade -f secrets-prod.yaml（该文件由 SOPS/age 加密后再入库）；
#   3) CI 中 --set-string secrets.XXX=$ENV_VAR 从密钥管理系统注入。
# 本地/CI 冒烟可临时 --set secrets.allowInsecureDefaults=true 放行空值。
secrets:
  # 引用已存在的 Secret 名称（由外部体系管理）。设置后本 Chart 不再渲染下方任何密钥。
  existingSecret: null
  # 外部 Secret 的版本/指纹。existingSecret 非空时必须提供；轮换后更新该值会触发 Pod 滚动更新。
  # Helm 无法读取外部 Secret 内容，因此发布流程必须把密钥版本写入这里，不能把“Secret 已更新”当作“Pod 已重载”。
  existingSecretRevision: ""
  # 是否允许空值/占位符通过校验；仅限本地与 CI 冒烟，生产必须保持 false
  allowInsecureDefaults: false
  # 主数据源密码
  MASTER_DATASOURCE_PASSWORD: "__REQUIRED__"
  # 从数据源密码
  SLAVE_DATASOURCE_PASSWORD: "__REQUIRED__"
  # Redis 密码
  REDIS_PASSWORD: "__REQUIRED__"
  # Postgres 容器/扩展初始化密码
  POSTGRES_PASSWORD: "__REQUIRED__"
  # AI-RAG 独立 PostgreSQL 密码（应用读取 zhicloud.airag.datasource.password）
  ZHICLOUD_AIRAG_DATASOURCE_PASSWORD: "__REQUIRED__"
  # MyBatis 加密器密码
  MYBATIS_ENCRYPTOR_PASSWORD: "__REQUIRED__"
  # API 请求加密 Key
  API_ENCRYPT_REQUEST_KEY: "__REQUIRED__"
  # API 响应加密 Key
  API_ENCRYPT_RESPONSE_KEY: "__REQUIRED__"
  # Druid 监控台用户名
  DRUID_USERNAME: "druid"
  # Druid 监控台密码
  DRUID_PASSWORD: "__REQUIRED__"
  # SBA 监控密码
  SBA_PASSWORD: "__REQUIRED__"
  # AI 平台 API Key（OpenAI/通义千问等）
  AI_API_KEY: "__REQUIRED__"

# ----- Flyway 迁移 Job 配置（PreSync 阶段执行）-----
migration:
  # 是否启用迁移 Job
  enabled: true
  baselineMode: existing
  # 迁移失败策略：失败则阻止后续 Sync
  backoffLimit: 2
  # 迁移完成后的 TTL（秒），超时自动清理
  ttlSecondsAfterFinished: 600
  # 迁移最长执行时间（秒）；超时视为失败，避免卡死 PreSync 阶段
  activeDeadlineSeconds: 900

# ----- 生产管理员引导 Job 配置（ArgoCD PreSync）-----
# 默认关闭：生产首次安装或受控 break-glass 时显式开启。
# 注意：ensure 模式不会覆盖已存在但口令不匹配的账号；口令轮换必须显式使用 rotate。
bootstrapAdmin:
  enabled: false
  mode: ensure
  username: zhicloud_admin
  tenantId: 1
  roleId: 1
  postId: 4
  bcryptCost: 12
  # 独立 Secret 名称与 key；启用时由 Helm required 强制校验。
  passwordSecretName: ""
  passwordSecretKey: "BOOTSTRAP_ADMIN_PASSWORD"
  backoffLimit: 2
  ttlSecondsAfterFinished: 1800
  activeDeadlineSeconds: 600

# ----- Pod 调度 / 亲和性 / 拓扑分布 -----
nodeSelector: {}
tolerations: []
affinity: {}
# 拓扑分布约束：跨节点/可用区打散
topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# ----- Pod 附加标签/注解 -----
podLabels: {}
podAnnotations: {}

# ----- 额外 volumes / volumeMounts（如挂载 tmp 可写目录）-----
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

# ----- PodDisruptionBudget（与原生 yaml 对齐）-----
pdb:
  enabled: true
  minAvailable: 1
