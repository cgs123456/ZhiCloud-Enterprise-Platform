# ============================================================
# zhicloud-server Helm Chart - DEV 环境覆盖配置
# 用途：开发环境覆盖，单副本 + 低资源 + 调试用
# 使用：helm install zhicloud ./zhicloud -f values-dev.yaml -n zhicloud-dev
# ============================================================

# 开发环境单副本（HPA 关闭，固定副本便于调试）
replicaCount: 1

# 镜像：dev 环境使用 latest tag 便于快速迭代
image:
  tag: "2026.06.0-dev"

# 关闭 HPA（开发环境固定副本）
hpa:
  enabled: false

# 关闭 PDB（开发环境无需）
pdb:
  enabled: false

# 资源配额（开发环境低配）
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Ingress：开发环境域名
ingress:
  enabled: true
  host: "api-dev.zhicloud.example.com"
  tls:
    enabled: false

# 环境变量：dev profile
env:
  SPRING_PROFILES_ACTIVE: "dev"
  # 开发环境指向本地/独立数据库
  MASTER_DATASOURCE_URL: "jdbc:mysql://zhicloud-mysql-dev:3306/zhicloud_platform?useSSL=true&requireSSL=true&verifyServerCertificate=false&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true"
  SLAVE_DATASOURCE_URL: "jdbc:mysql://zhicloud-mysql-dev:3306/zhicloud_platform?useSSL=true&requireSSL=true&verifyServerCertificate=false&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true"
  REDIS_HOST: "zhicloud-redis-dev"
  ZHICLOUD_AIRAG_DATASOURCE_URL: "jdbc:postgresql://zhicloud-postgres-dev:5432/zhicloud_rag"
  ZHICLOUD_AIRAG_INITIALIZE_SCHEMA: "false"
  # 关闭 OTel（开发环境可选）
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://zhicloud-jaeger-dev:4318/v1/traces"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://zhicloud-jaeger-dev:4318/v1/traces"

# 开发环境保留宽松 TLS 配置，不挂载生产 truststore
mysqlTls:
  enabled: false

# 管理员引导 Job：默认关闭，首次安装/受控轮换时按 runbook 显式开启。
bootstrapAdmin:
  enabled: false
  mode: ensure
  passwordSecretName: ""
  passwordSecretKey: "BOOTSTRAP_ADMIN_PASSWORD"

# Kubernetes 开发环境同样由 PreSync Job 迁移，避免业务 Pod 形成第二迁移入口。
migration:
  enabled: true
  baselineMode: existing

# 优雅停机：开发环境缩短
terminationGracePeriodSeconds: 15

# 健康检查：开发环境缩短初始延迟
probes:
  liveness:
    initialDelaySeconds: 30
  readiness:
    initialDelaySeconds: 15

# 调试：开发环境不强制非 root（便于本地挂载调试）
# 注意：如需保持 nonroot，注释下方配置即可
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  allowPrivilegeEscalation: false
