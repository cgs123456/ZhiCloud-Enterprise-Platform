{{/*
============================================================
zhicloud-server ConfigMap 模板
存放应用非敏感配置（数据源 URL、Redis、RAG、OTel 等）
通过 envFrom.configMapRef 注入到容器环境变量
敏感信息（密码）请放入 Secret，不要放此处
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zhicloud.fullname" . }}-config
  namespace: {{ include "zhicloud.namespace" . }}
  labels:
    {{- include "zhicloud.labels" . | nindent 4 }}
data:
  # Spring profile（dev/staging/prod）
  SPRING_PROFILES_ACTIVE: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
  # 时区
  TZ: {{ .Values.env.TZ | quote }}
  # JVM 参数
  JAVA_OPTS: {{ .Values.env.JAVA_OPTS | quote }}
  # ----- 主数据源（密码见 Secret）-----
  MASTER_DATASOURCE_URL: {{ .Values.env.MASTER_DATASOURCE_URL | quote }}
  MASTER_DATASOURCE_USERNAME: {{ .Values.env.MASTER_DATASOURCE_USERNAME | quote }}
  # ----- 从数据源 -----
  SLAVE_DATASOURCE_URL: {{ .Values.env.SLAVE_DATASOURCE_URL | quote }}
  SLAVE_DATASOURCE_USERNAME: {{ .Values.env.SLAVE_DATASOURCE_USERNAME | quote }}
  # ----- Redis -----
  REDIS_HOST: {{ .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.env.REDIS_PORT | quote }}
  # ----- RAG 数据源 -----
  ZHICLOUD_AIRAG_ENABLED: {{ .Values.env.ZHICLOUD_AIRAG_ENABLED | quote }}
  ZHICLOUD_AIRAG_DATASOURCE_URL: {{ .Values.env.ZHICLOUD_AIRAG_DATASOURCE_URL | quote }}
  ZHICLOUD_AIRAG_DATASOURCE_USERNAME: {{ .Values.env.ZHICLOUD_AIRAG_DATASOURCE_USERNAME | quote }}
  # ----- OTel 链路追踪 -----
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
  MANAGEMENT_OTLP_TRACING_ENDPOINT: {{ .Values.env.MANAGEMENT_OTLP_TRACING_ENDPOINT | quote }}
