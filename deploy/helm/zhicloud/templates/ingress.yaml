{{/*
============================================================
zhicloud-server Ingress 模板
外部流量入口，启用 TLS 终结
- 当 ingress.enabled=false 时跳过
- TLS 证书需提前通过 cert-manager 或 kubectl create secret tls 创建
- Nginx 注解调整上传/超时参数
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zhicloud.fullname" . }}
  namespace: {{ include "zhicloud.namespace" . }}
  labels:
    {{- include "zhicloud.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zhicloud.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
