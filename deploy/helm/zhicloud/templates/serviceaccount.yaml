{{/*
============================================================
zhicloud-server ServiceAccount 模板
- 当 serviceAccount.create=true 时创建
- 若 serviceAccount.name 为空，使用 fullname 作为名称
- 绑定 automountServiceAccountToken 控制是否自动挂载 API token
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zhicloud.serviceAccountName" . }}
  namespace: {{ include "zhicloud.namespace" . }}
  labels:
    {{- include "zhicloud.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
