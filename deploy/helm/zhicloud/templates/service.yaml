{{/*
============================================================
zhicloud-server Service 模板
暴露两个端口：
  - 48080：HTTP 业务流量
  - 48090：Actuator（健康检查/监控）
selectorLabels 与 Deployment 对齐
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zhicloud.fullname" . }}
  namespace: {{ include "zhicloud.namespace" . }}
  labels:
    {{- include "zhicloud.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # HTTP 业务端口
    - name: {{ .Values.service.portName }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
    # Actuator 端口（仅集群内访问，用于健康检查/监控）
    - name: {{ .Values.service.actuatorPortName }}
      port: {{ .Values.service.actuatorPort }}
      targetPort: {{ .Values.service.actuatorPort }}
      protocol: TCP
  selector:
    {{- include "zhicloud.selectorLabels" . | nindent 4 }}
