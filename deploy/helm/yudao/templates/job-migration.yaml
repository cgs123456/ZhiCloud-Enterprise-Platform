{{/*
============================================================
yudao-server Flyway 数据库迁移 Job 模板（ArgoCD PreSync 阶段执行）
执行时机：在主应用 Deployment 滚动更新前运行
- ArgoCD 通过 argocd.argoproj.io/hook: PreSync 注解识别
- hook-delete-policy: before-hook-creation 表示每次 Sync 前先删除旧 Job
- sync-wave: -1 保证本 Job 早于业务工作负载

设计说明：
  1. 复用 yudao-server 业务镜像，无需额外构建迁移镜像
  2. 通过 Spring Boot PropertiesLauncher 直接运行 fat jar 内的
     cn.iocoder.yudao.server.DatabaseMigrationRunner，只加载 Flyway + JDBC，
     不启动 Web 容器 / Redis / MQ 等业务组件，进程执行完即退出
  3. 迁移串行化：本 Job 先跑完（completions=1、parallelism=1），业务副本才滚动；
     Flyway 自身还会在 MySQL 上对 schema history 表加 GET_LOCK 兜底并发
  4. 退出码非 0 时 PreSync 失败，直接阻断本次发布（不再是"echo 假装成功"）
  5. 业务应用侧仍保留 spring.flyway.enabled 作为兜底，但正常路径下
     Job 已把脚本执行完，应用启动时只做校验
*/}}
{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "yudao.fullname" . }}-migration
  namespace: {{ include "yudao.namespace" . }}
  labels:
    {{- include "yudao.labels" . | nindent 4 }}
  annotations:
    # ArgoCD Sync Hook：在主资源 Sync 前执行
    argocd.argoproj.io/hook: PreSync
    # 删除策略：每次创建新 Hook 前删除旧 Job（保证幂等）
    argocd.argoproj.io/hook-delete-policy: before-hook-creation
    # 失败时是否跳过后续 Sync：返回非 0 即失败
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 失败重试次数
  backoffLimit: {{ .Values.migration.backoffLimit }}
  # 完成后保留时长（秒），便于排查
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  # 串行化：只允许一个 Pod、只需一次成功完成，杜绝并发迁移
  completions: 1
  parallelism: 1
  # 迁移超时上限，避免异常时长期占住 PreSync 阶段
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds | default 900 }}
  template:
    metadata:
      labels:
        {{- include "yudao.selectorLabels" . | nindent 8 }}
        job-type: flyway-migration
    spec:
      # Never + backoffLimit：失败即产生新 Pod 便于保留失败现场日志，且失败会真实反映到 Job 状态
      restartPolicy: Never
      serviceAccountName: {{ include "yudao.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: flyway-migration
          image: {{ include "yudao.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # 复用 ConfigMap/Secret 环境变量，保证数据库连接信息可用
          envFrom:
            - configMapRef:
                name: {{ include "yudao.fullname" . }}-config
            - secretRef:
                name: {{ include "yudao.secretName" . }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
          # 直接运行 fat jar 内的迁移入口类：只初始化 Flyway + JDBC，跑完即退出。
          # 迁移失败会以非 0 退出码结束，从而让 PreSync Hook 失败并阻断发布。
          command:
            - java
          args:
            - -XX:MaxRAMPercentage=75
            - -Duser.timezone={{ .Values.env.TZ }}
            - -Dloader.main=cn.iocoder.yudao.server.DatabaseMigrationRunner
            - -cp
            - /yudao-server/app.jar
            - org.springframework.boot.loader.launch.PropertiesLauncher
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- include "yudao.resources" . | nindent 10 }}
{{- end }}
