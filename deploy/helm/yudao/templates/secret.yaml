{{/*
============================================================
yudao-server Secret 模板

安全策略（此前的问题：values.yaml 里 11 个密钥默认值全是 CHANGE_ME_IN_PRODUCTION，
helm install 照样成功，"忘记改密码"会静默进入生产）：

  1. 首选：设置 secrets.existingSecret 指向由外部体系管理的 Secret
     （External Secrets Operator + Vault/AWS SM、Sealed Secrets、SOPS+age），
     此时本模板不渲染任何明文，Chart 里不存在密钥物料。
  2. 次选：通过 --set-string / -f 注入真实值，本模板校验后写入 Secret。
  3. 任何仍为空或以 CHANGE_ME 开头的值都会让 helm 渲染直接失败（见 yudao.requiredSecret）。
  4. 仅本地/CI 冒烟可用 --set secrets.allowInsecureDefaults=true 临时放行。
============================================================
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yudao.fullname" . }}-secret
  namespace: {{ include "yudao.namespace" . }}
  labels:
    {{- include "yudao.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 主数据源密码
  MASTER_DATASOURCE_PASSWORD: {{ include "yudao.requiredSecret" (list . "MASTER_DATASOURCE_PASSWORD" .Values.secrets.MASTER_DATASOURCE_PASSWORD) }}
  # 从数据源密码
  SLAVE_DATASOURCE_PASSWORD: {{ include "yudao.requiredSecret" (list . "SLAVE_DATASOURCE_PASSWORD" .Values.secrets.SLAVE_DATASOURCE_PASSWORD) }}
  # Redis 密码
  REDIS_PASSWORD: {{ include "yudao.requiredSecret" (list . "REDIS_PASSWORD" .Values.secrets.REDIS_PASSWORD) }}
  # Postgres 密码
  POSTGRES_PASSWORD: {{ include "yudao.requiredSecret" (list . "POSTGRES_PASSWORD" .Values.secrets.POSTGRES_PASSWORD) }}
  # MyBatis 加密器密码
  MYBATIS_ENCRYPTOR_PASSWORD: {{ include "yudao.requiredSecret" (list . "MYBATIS_ENCRYPTOR_PASSWORD" .Values.secrets.MYBATIS_ENCRYPTOR_PASSWORD) }}
  # API 请求加密 Key
  API_ENCRYPT_REQUEST_KEY: {{ include "yudao.requiredSecret" (list . "API_ENCRYPT_REQUEST_KEY" .Values.secrets.API_ENCRYPT_REQUEST_KEY) }}
  # API 响应加密 Key
  API_ENCRYPT_RESPONSE_KEY: {{ include "yudao.requiredSecret" (list . "API_ENCRYPT_RESPONSE_KEY" .Values.secrets.API_ENCRYPT_RESPONSE_KEY) }}
  # Druid 监控台凭据（用户名非敏感，密码强制校验）
  DRUID_USERNAME: {{ .Values.secrets.DRUID_USERNAME | default "druid" | quote }}
  DRUID_PASSWORD: {{ include "yudao.requiredSecret" (list . "DRUID_PASSWORD" .Values.secrets.DRUID_PASSWORD) }}
  # SBA 监控密码
  SBA_PASSWORD: {{ include "yudao.requiredSecret" (list . "SBA_PASSWORD" .Values.secrets.SBA_PASSWORD) }}
  # AI 平台 API Key（OpenAI/通义千问等）
  AI_API_KEY: {{ include "yudao.requiredSecret" (list . "AI_API_KEY" .Values.secrets.AI_API_KEY) }}
{{- end }}
