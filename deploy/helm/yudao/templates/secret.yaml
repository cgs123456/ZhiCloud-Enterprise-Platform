{{/*
============================================================
yudao-server Secret 模板
存放敏感配置（数据库密码、Redis 密码、AI API Key 等）
使用 stringData 明文书写，K8s 自动 base64 编码到 data 字段
部署前请通过外部 Secret 管理工具替换 CHANGE_ME_IN_PRODUCTION 占位符：
  - Sealed Secrets
  - External Secrets Operator + Vault/AWS SM
  - SOPS + age
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yudao.fullname" . }}-secret
  namespace: {{ include "yudao.namespace" . }}
  labels:
    {{- include "yudao.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 主数据源密码
  MASTER_DATASOURCE_PASSWORD: {{ .Values.secrets.MASTER_DATASOURCE_PASSWORD | quote }}
  # 从数据源密码
  SLAVE_DATASOURCE_PASSWORD: {{ .Values.secrets.SLAVE_DATASOURCE_PASSWORD | quote }}
  # Redis 密码
  REDIS_PASSWORD: {{ .Values.secrets.REDIS_PASSWORD | quote }}
  # Postgres 密码
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  # MyBatis 加密器密码
  MYBATIS_ENCRYPTOR_PASSWORD: {{ .Values.secrets.MYBATIS_ENCRYPTOR_PASSWORD | quote }}
  # API 请求加密 Key
  API_ENCRYPT_REQUEST_KEY: {{ .Values.secrets.API_ENCRYPT_REQUEST_KEY | quote }}
  # API 响应加密 Key
  API_ENCRYPT_RESPONSE_KEY: {{ .Values.secrets.API_ENCRYPT_RESPONSE_KEY | quote }}
  # Druid 监控台凭据
  DRUID_USERNAME: {{ .Values.secrets.DRUID_USERNAME | quote }}
  DRUID_PASSWORD: {{ .Values.secrets.DRUID_PASSWORD | quote }}
  # SBA 监控密码
  SBA_PASSWORD: {{ .Values.secrets.SBA_PASSWORD | quote }}
  # AI 平台 API Key（OpenAI/通义千问等）
  AI_API_KEY: {{ .Values.secrets.AI_API_KEY | quote }}
