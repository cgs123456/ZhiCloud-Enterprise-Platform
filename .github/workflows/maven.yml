# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    # NVD API Key 提升到 job 级别，使后续步骤的 if 条件可以引用（step 级 env 无法用于自身 if）
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21.0.9 and Maven 3.9.11
      uses: actions/setup-java@v4
      with:
        java-version: '21.0.9'
        distribution: 'temurin'
        maven-version: '3.9.11'
        cache: maven
    # 错误码唯一性门禁：fast-fail 在 mvn verify 之前，避免重复码悄悄合入。
    # 全量严格检查——全仓错误码已通过 scripts/renumber_error_codes.py 去重（140 处历史冲突归零），
    # 任何重复（含历史遗留）都将失败，作为防回归护栏。
    - name: Error Code Uniqueness Gate
      run: python3 scripts/check_error_codes.py
    # 写接口方法级鉴权护栏：扫描 Controller（含 controller/app 下的 PDA/移动端端点），
    # 若写操作(POST/PUT/PATCH/DELETE)缺 @PreAuthorize、或被 @PermitAll 放行为匿名可访问，即失败。
    #
    # 必须带 --include-app：早期该门禁默认跳过 controller/app，恰好漏掉了
    # WmsPda{Pick,Inventory,Receipt}Controller 与 MesProPdaFeedbackController 的 @PermitAll
    # （PDA 全量接口匿名可达 + pickerUserId/feedbackUserId 越权），
    # 这个盲区就是阻断级漏洞长期未被发现的直接原因。
    # 确需匿名的接口（登录入口/第三方回调/无副作用计数）登记在 scripts/permitall-allowlist.txt。
    #
    # 两道门禁，职责不同，都要保留：
    #   1) 全仓门禁：[CRITICAL]（匿名可写）零容忍；[GAP]（缺 @PreAuthorize 但仍需登录）
    #      是 0 个历史存量，用 --max-gaps 棘轮卡住只降不升，清理后按脚本提示下调基线。
    #      只扫 WMS 是不够的——历史上全仓一度有 51 个匿名写接口在门禁视野之外。
    #   2) WMS 严格门禁：WMS 已完成整改，[GAP] 必须保持 0，不吃全仓基线的豁免。
    - name: Full-Repo @PreAuthorize / @PermitAll Gate
      run: python3 scripts/check_missing_preauthorize.py --include-app --max-gaps 0
    - name: WMS Strict @PreAuthorize Gate (zero tolerance)
      run: python3 scripts/check_missing_preauthorize.py --module zhicloud-module-wms --include-app
    # 电子签名管控点存活门禁（21 CFR Part 11）。
    # 历史教训：@ElectronicSignature 注解 + 切面实现得非常完整（fail-closed、审计留痕俱全），
    # 但全仓使用次数是 0——切面从未被触发，是一段死代码，Part 11 管控点在运行时根本不存在。
    # 「实现正确」与「已经接线」是两件事，人工评审只会检查前者，故必须由门禁盯住后者。
    - name: Electronic Signature Control Point Gate
      run: python3 scripts/check_electronic_signature.py
    # 裸抛异常回归门禁：扫描 cn/zhicloud/zhicloud 包内是否残留
    # throw new RuntimeException / IllegalStateException（绕过 ErrorCode 体系）。
    # 全量转换已在本次提交完成（scripts/convert_bare_throws.py，74 处），
    # 任何回归都将失败，作为防回归护栏。
    #
    # 豁免：运行在 Spring 容器之外的代码（如 DatabaseMigrationRunner 这个 Flyway 迁移 CLI）
    # 硬套 ServiceException 需要为一个永远不会返回给 API 调用方的错误注册全局错误码，得不偿失。
    # 这类位置在 throw 上方注释写 `// @bare-throw-ignore <理由>` 显式豁免；
    # 脚本会把全部豁免项打印到 CI 日志，防止悄悄累积。
    - name: Bare-Throw Exception Gate
      run: python3 scripts/check_bare_throws.py
    # 事务原子性回归门禁：扫描「单个方法写入 >= 2 个不同 Mapper/Service 却未标注事务注解」的 ServiceImpl 方法。
    # 这类方法中途异常会留下半提交脏数据（部分表已写、部分未写），且大多无自愈路径。
    # 全量修复已在本次提交完成（12 处），当前基线为 0，任何回归都将失败。
    #
    # 脚本要点（踩过的坑，勿回退）：
    #   1) 事务注解不止 @Transactional——多数据源用 @DSTransactional，分布式用 @GlobalTransactional，
    #      三者都要认，否则大量误报；
    #   2) 必须按括号配平向上回溯完整注解块，否则 @LogRecord(...) 这类跨行注解会挡住上方的 @Transactional；
    #   3) 确有不该加事务的方法（内含 sleep / 外部 HTTP / 文件下载，包事务会长时间占用数据库连接），
    #      在方法上方注释写 `// @tx-ignore <理由>` 显式豁免——理由留在代码里可被 review，不做脚本白名单。
    - name: Transaction Atomicity Gate
      run: |
        python3 scripts/scan_tx.py \
          zhicloud-module-crm zhicloud-module-erp zhicloud-module-wms zhicloud-module-mes \
          zhicloud-module-qms zhicloud-module-tms zhicloud-module-bpm zhicloud-module-oa \
          zhicloud-module-hr zhicloud-module-ai zhicloud-module-ai-rag zhicloud-module-system \
          zhicloud-module-infra \
          zhicloud-module-mp zhicloud-module-im zhicloud-module-iot zhicloud-module-report \
          zhicloud-module-datalake
    # 迁移契约门禁：V90+ 已审核迁移的字节哈希、版本唯一性、验证 SQL 与 R1-R5 lint
    # 必须全部通过。该门禁只证明文本契约，不替代真实 MySQL 影子库/预生产执行。
    - name: Migration Contract and Lint Gate
      run: python3 scripts/production/check_migration_contract.py
    # 重复建表收敛门禁：扫描全部 Flyway 迁移中的重复 CREATE TABLE，与 duplicate_ddl_allowlist.json 比对。
    # 未登记的重复建表、白名单失效、缺少收敛迁移（V98）均会失败。
    # 该门禁为静态检查（不连库），不替代 information_schema 真机结构比对与预生产执行。
    - name: Duplicate DDL Convergence Gate
      run: python3 scripts/production/check_duplicate_ddl.py
    - name: Build with Maven
      shell: bash
      run: |
        set -o pipefail
        mvn -B -V clean verify --file pom.xml | tee maven-build.log
    - name: Upload Surefire Reports
      if: always()
      # 存储配额/网络故障不得让后续安全门禁被 skipped（fail-open）。见台账 §12.171。
      # 产物只是取证便利，不是代码门禁；失败仍在步骤上可见，但不阻断 job。
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: '**/target/surefire-reports/**'
        if-no-files-found: warn
        retention-days: 30
    - name: Upload Maven Build Log
      if: always()
      # 存储配额/网络故障不得让后续安全门禁被 skipped（fail-open）。见台账 §12.171。
      # 产物只是取证便利，不是代码门禁；失败仍在步骤上可见，但不阻断 job。
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: maven-build-log
        path: maven-build.log
        if-no-files-found: warn
        retention-days: 30
    - name: Security Check (deploy gate)
      run: |
        chmod +x script/security/security-check.sh
        ./script/security/security-check.sh
    # NVD 漏洞库体积较大，缓存后可将后续构建的同步时间从分钟级降到秒级
    - name: Cache NVD Database
      if: env.NVD_API_KEY != ''
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-data-${{ github.run_id }}
        restore-keys: nvd-data-
    - name: OWASP Dependency Check
      if: env.NVD_API_KEY != ''
      run: mvn dependency-check:check -DskipTests -Dnvd.api.key=$NVD_API_KEY
    # 未配置 Key 时显式告警并跳过，而不是用 continue-on-error 伪装成通过
    - name: OWASP Dependency Check (skipped)
      if: env.NVD_API_KEY == ''
      run: |
        echo "::warning title=OWASP 扫描已跳过::未配置仓库 Secret NVD_API_KEY，依赖漏洞扫描未执行。请在 Settings → Secrets and variables → Actions 添加 NVD_API_KEY 以启用 CVSS>=7 阻断门禁。"
    - name: Upload Dependency Check Report
      if: always() && env.NVD_API_KEY != ''
      # 存储配额/网络故障不得让后续安全门禁被 skipped（fail-open）。见台账 §12.171。
      # 产物只是取证便利，不是代码门禁；失败仍在步骤上可见，但不阻断 job。
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html
        retention-days: 30
    - name: Generate CycloneDX SBOM (P2-3 软件物料清单)
      run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests -q
    # 许可证治理（T-107）：SBOM 只是"清单"，清单本身不等于"合规判定"。
    # 这里把 CycloneDX BOM + 服务端运行时依赖树喂给 generate_license_inventory.py 生成治理清单，
    # 再用 check_license_policy.py 做 allow / deny / review 判定。
    # 2026-10-03 所有者决定：本项目为内部自研、不对外分发，**许可证不作为合入门禁**，
    # 因此本步骤带 --record-only —— 判定照常算、denied/review_required 数组照常写盘并上传，
    # 但退出码恒 0。这不是"放宽 policy 变绿"（那会让判定数组被清空、风险消失）：
    # 证据仍在 license-policy-gate.json 与 license-governance 产物里，随时可复核。
    # 要恢复阻断：去掉 --record-only 即可，判定逻辑一行未动。
    # 仍需人工注意：本步骤 exit=2 表示**输入坏了**（BOM/清单/策略读不出、日期格式错），
    # 那不是合规问题而是门禁自身故障，下面的 License Gate Error Guidance 会指出来。
    #
    # 两个踩过的坑，勿回退：
    #   1) dependency:tree 必须带 -am：CI 的 ~/.m2 里没有本仓 SNAPSHOT，
    #      单跑 -pl zhicloud-server 无法解析兄弟模块；zhicloud-server 聚合了全部业务模块，
    #      故 -am 产出的并集与服务端运行时闭包等价。
    #   2) dependency:tree 不能用 -q：解析器只认 "[INFO]" 前缀行，-q 会让运行时闭包退化为空集，
    #      全部组件被误判为非运行时。
    - name: Resolve Runtime Dependency Tree (license gate input)
      shell: bash
      run: |
        set -o pipefail
        mvn -B -pl zhicloud-server -am org.apache.maven.plugins:maven-dependency-plugin:3.7.0:tree \
          -Dscope=runtime -DskipTests 2>&1 | tee dependency-tree-server-runtime.log
    - name: Build License Inventory
      run: |
        python3 scripts/production/generate_license_inventory.py \
          --bom target/bom.json \
          --runtime-tree dependency-tree-server-runtime.log \
          --output license-inventory.json \
          --change-note "CI regenerated: aggregate CycloneDX BOM + zhicloud-server runtime tree"
    # 用 step id 精确定位失败来源：if: failure() 会把前面 Maven 构建失败也误报成许可证问题，
    # 那是误导性告警，会让真正的构建故障被当成合规问题排查。
    - name: License Policy Gate (record-only per owner 2026-10-03)
      id: license_gate
      run: |
        python3 scripts/production/check_license_policy.py \
          --inventory license-inventory.json \
          --policy scripts/production/license-policy.json \
          --output license-policy-gate.json \
          --record-only
    - name: License Gate Error Guidance
      if: steps.license_gate.outcome == 'failure'
      run: |
        echo "::error title=许可证门禁自身故障::本步骤已按所有者决定改为只记录不阻断，因此它失败**不是**合规结论，而是门禁输入坏了（license-inventory.json / license-policy.json 读不出、evidence_type 不符、allowlist 日期格式非法，即脚本 exit=2）。请查这一步的 stdout 与 license-inventory.json，别去放宽 policy 找绿。"
    - name: License Posture Notice（不阻断，只把风险留在页面上）
      if: steps.license_gate.outcome == 'success'
      run: |
        python3 - <<'PY'
        import json, pathlib
        p = pathlib.Path("license-policy-gate.json")
        if not p.is_file():
            print("::warning title=许可证只记录模式::没产出 license-policy-gate.json，判定面空转")
            raise SystemExit(0)
        r = json.loads(p.read_text(encoding="utf-8"))
        c = r.get("counts", {})
        print("::warning title=许可证只记录模式（所有者决定 2026-10-03）::"
              f"decision={r.get('decision')} blocking={r.get('blocking')} "
              f"components={c.get('components')} denied={c.get('denied')} "
              f"review_required={c.get('review_required')} runtime_blocked={c.get('runtime_blocked')}"
              " —— 逐项清单见 license-governance 产物里的 license-policy-gate.json 的 denied / review_required 数组；"
              "恢复阻断：给该步骤去掉 --record-only")
        PY
    - name: Upload License Governance Evidence
      if: always()
      # 存储配额/网络故障不得让后续安全门禁被 skipped（fail-open）。见台账 §12.171。
      # 产物只是取证便利，不是代码门禁；失败仍在步骤上可见，但不阻断 job。
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: license-governance
        path: |
          license-inventory.json
          license-policy-gate.json
          dependency-tree-server-runtime.log
        if-no-files-found: warn
        retention-days: 90
    - name: Upload SBOM Artifact
      if: always()
      # 存储配额/网络故障不得让后续安全门禁被 skipped（fail-open）。见台账 §12.171。
      # 产物只是取证便利，不是代码门禁；失败仍在步骤上可见，但不阻断 job。
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: cyclonedx-sbom
        path: target/bom.*
        retention-days: 90  # SBOM 保留 90 天，满足合规审计要求
  v77-repair-script:
    name: V77 Repair Script (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_ROOT_PASSWORD: ci-v77-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
    - uses: actions/checkout@v4
    - name: Install MySQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y default-mysql-client
    - name: Verify V77 repair script against MySQL 8.4
      env:
        MYSQL_PASSWORD: ci-v77-root
      run: bash scripts/production/verify_v77_repair_mysql.sh
  windows-launcher-contract:
    name: Windows Launcher Contract
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21 and Maven
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        maven-version: '3.9.16'
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Backend launcher prerequisites (clean checkout)
      shell: cmd
      run: start-backend.bat --check
    - name: Frontend launcher prerequisites (clean checkout)
      shell: cmd
      run: start-frontend.bat --check