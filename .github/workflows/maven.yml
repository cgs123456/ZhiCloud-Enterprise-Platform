# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    # NVD API Key 提升到 job 级别，使后续步骤的 if 条件可以引用（step 级 env 无法用于自身 if）
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    strategy:
      matrix:
        java: [ '21' ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    # 错误码唯一性门禁：fast-fail 在 mvn verify 之前，避免重复码悄悄合入。
    # 全量严格检查——全仓错误码已通过 scripts/renumber_error_codes.py 去重（140 处历史冲突归零），
    # 任何重复（含历史遗留）都将失败，作为防回归护栏。
    - name: Error Code Uniqueness Gate
      run: python3 scripts/check_error_codes.py
    # WMS 写接口方法级鉴权护栏：扫描 yudao-module-wms 的 admin Controller，
    # 若存在写操作(POST/PUT/DELETE)缺 @PreAuthorize 即失败，防止回归。
    # 范围刻意限定 WMS admin（当前 0 缺口，全绿）；PDA/app 端点按本仓约定为
    # 登录即可用（controller/app 全仓均无 @PreAuthorize），不纳入此门禁。
    - name: WMS @PreAuthorize Gate
      run: python3 scripts/check_missing_preauthorize.py --module yudao-module-wms
    # 裸抛异常回归门禁：扫描 cn/iocoder/yudao 包内是否残留
    # throw new RuntimeException / IllegalStateException（绕过 ErrorCode 体系）。
    # 全量转换已在本次提交完成（scripts/convert_bare_throws.py，74 处），
    # 任何回归都将失败，作为防回归护栏。
    - name: Bare-Throw Exception Gate
      run: python3 scripts/check_bare_throws.py
    - name: Build with Maven
      run: mvn -B verify --file pom.xml
    - name: Security Check (deploy gate)
      run: |
        chmod +x script/security/security-check.sh
        ./script/security/security-check.sh
    # NVD 漏洞库体积较大，缓存后可将后续构建的同步时间从分钟级降到秒级
    - name: Cache NVD Database
      if: env.NVD_API_KEY != ''
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-data-${{ github.run_id }}
        restore-keys: nvd-data-
    - name: OWASP Dependency Check
      if: env.NVD_API_KEY != ''
      run: mvn dependency-check:check -DskipTests -Dnvd.api.key=$NVD_API_KEY
    # 未配置 Key 时显式告警并跳过，而不是用 continue-on-error 伪装成通过
    - name: OWASP Dependency Check (skipped)
      if: env.NVD_API_KEY == ''
      run: |
        echo "::warning title=OWASP 扫描已跳过::未配置仓库 Secret NVD_API_KEY，依赖漏洞扫描未执行。请在 Settings → Secrets and variables → Actions 添加 NVD_API_KEY 以启用 CVSS>=7 阻断门禁。"
    - name: Upload Dependency Check Report
      if: always() && env.NVD_API_KEY != ''
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html
        retention-days: 30
    - name: Generate CycloneDX SBOM (P2-3 软件物料清单)
      run: mvn org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests -q
    - name: Upload SBOM Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cyclonedx-sbom
        path: target/bom.*
        retention-days: 90  # SBOM 保留 90 天，满足合规审计要求
