# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  # pull_request:
  #   branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '21' ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify --file pom.xml -Djacoco.minimum=0.00
    - name: Security Check (deploy gate)
      run: |
        chmod +x script/security/security-check.sh
        ./script/security/security-check.sh
      continue-on-error: true  # 安全检查仅报告，不阻断 CI（部署前人工 review）
    - name: OWASP Dependency Check
      run: mvn dependency-check:check -DskipTests -Ddependency-check.suppressionFile=dependency-check-suppressions.xml
      continue-on-error: true  # 初期不阻断流水线，定期 review 报告
    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html
        retention-days: 30
    - name: Generate CycloneDX SBOM (P2-3 软件物料清单)
      run: mvn cyclonedx:makeAggregateBom -DskipTests -q
    - name: Upload SBOM Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cyclonedx-sbom
        path: target/bom.*
        retention-days: 90  # SBOM 保留 90 天，满足合规审计要求
