spring:
  application:
    name: yudao-server

  # 禁用 PgVectorStore 自动配置 + 多个 EmbeddingModel 自动配置（避免 bean 冲突，由 AiragConfiguration 自定义）
  # 注意：spring.autoconfigure.exclude 用全限定类名逗号分隔
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration

  profiles:
    active: local

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。

  # P1-3 Flyway：数据库版本管理（替代 sql/ 手工脚本）
  # 策略：baseline-on-migrate=true 对存量库建立基线（V1），后续 V2+ 迁移脚本自动执行
  # 迁移脚本位置：yudao-server/src/main/resources/db/migration/
  # 命名规则：V{版本号}__{描述}.sql（双下划线分隔版本与描述）
  # 存量库（已有 zhicloud_platform 表）：baseline-version=1，跳过 V1，从 V2 起执行增量
  # 全新库：直接执行所有迁移脚本（V1__init 占位，实际初始化仍走 sql/mysql/zhicloud_platform.sql）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # 必须开启校验：关闭后「已应用脚本被事后篡改」不会报错，线上库与仓库 DDL 会静默漂移，
    # 生产事故时无法用迁移历史复现 schema。存量库若因历史差异校验失败，
    # 应通过补写 repair 迁移脚本或 flyway repair 处理，而不是长期关闭校验。
    validate-on-migrate: true
    # 允许 V1 基线之外的「补写历史版本」被检测出来并报错，避免乱序插入脚本
    out-of-order: false
    table: flyway_schema_history
    encoding: UTF-8

  # 虚拟线程配置（JDK 21 Project Loom，提升并发性能）
  # 虚拟线程 pinning 检测：JVM 启动参数加 -Djdk.tracePinnedThreads=full
  #   生产环境压测时打开，可在 stderr 输出 pinning 线程栈，定位 synchronized 阻塞点
  #   常见 pinning 源：synchronized 块、Object.wait()、JNI 调用、 FileInputStream
  # 已修复：
  #   1. Druid 1.2.20+ 已修复 synchronized pinning（当前 1.2.28 OK）
  #   2. MySQL Connector/J 8.2+ 已用 ReentrantLock 替换 synchronized（Spring Boot 3.5 BOM 8.4+ OK）
  #   3. HikariCP 不适用（本项目使用 Druid）
  threads:
    virtual:
      enabled: true # 启用虚拟线程，替代平台线程池

  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 16MB # 单个文件大小
      max-request-size: 32MB # 设置总上传的文件大小

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 Date 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 设置过期时间为 1 小时

  # 优雅停机生命周期配置（合并自原先独立的 spring 顶层键，避免 YAML 重复 key 报错）
  lifecycle:
    timeout-per-shutdown-phase: 30s # 优雅停机最大等待时间 30 秒

server:
  servlet:
    encoding:
      enabled: true
      charset: UTF-8 # 必须设置 UTF-8，避免 WebFlux 流式返回（AI 场景）会乱码问题
      force: true
    shutdown: graceful # 优雅停机，等待进行中请求完成

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档

knife4j:
  enable: true
  setting:
    language: zh_cn

# 工作流 Flowable 配置
flowable:
  # 1. false: 默认值，Flowable 启动时，对比数据库表中保存的版本，如果不匹配。将抛出异常
  # 2. true: 启动时会对数据库中所有表进行更新操作，如果表存在，不做处理，反之，自动创建表
  # 3. create_drop: 启动时自动创建表，关闭时自动删除表
  # 4. drop_create: 启动时，删除旧表，再创建新表
  database-schema-update: true # 设置为 false，可通过 https://github.com/flowable/flowable-sql 初始化
  db-history-used: true # flowable6 默认 true 生成信息表，无需手动设置
  check-process-definitions: false # 设置为 false，禁用 /resources/processes 自动部署 BPMN XML 流程
  history-level: audit # full：保存历史数据的最高级别，可保存全部流程相关细节，包括流程流转各节点参数

# MyBatis Plus 的配置项
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
  global-config:
    db-config:
      id-type: NONE # “智能”模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
#      id-type: AUTO # 自增 ID，适合 MySQL 等直接自增的数据库
#      id-type: INPUT # 用户输入 ID，适合 Oracle、PostgreSQL、Kingbase、DB2、H2 数据库
#      id-type: ASSIGN_ID # 分配 ID，默认使用雪花算法。注意，Oracle、PostgreSQL、Kingbase、DB2、H2 数据库时，需要去除实体类上的 @KeySequence 注解
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${yudao.info.base-package}.module.*.dal.dataobject
  encryptor:
    password: ${MYBATIS_ENCRYPTOR_PASSWORD:?required} # 加解密的秘钥（生产环境通过环境变量注入）

mybatis-plus-join:
  banner: false # 是否打印 mybatis plus join banner，默认true
  sub-table-logic: true # 全局启用副表逻辑删除，默认true。关闭后关联查询不会加副表逻辑删除
  ms-cache: true # 拦截器MappedStatement缓存，默认 true
  table-alias: t # 表别名(默认 t)
  logic-del-type: on # 副表逻辑删除条件的位置，支持 WHERE、ON，默认 ON

# Spring Data Redis 配置
spring:
  data:
    redis:
      repositories:
        enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度

# VO 转换（数据翻译）相关
easy-trans:
  is-enable-global: false # 【默认禁用，对性能确认压力大】启用全局翻译（拦截所有 SpringMVC ResponseBody 进行自动翻译 )。如果对于性能要求很高可关闭此配置，或通过 @IgnoreTrans 忽略某个接口

--- #################### 验证码相关配置 ####################

aj:
  captcha:
    jigsaw: classpath:images/jigsaw # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    pic-click: classpath:images/pic-click # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    cache-type: redis # 缓存 local/redis...
    cache-number: 1000 # local 缓存的阈值,达到这个值，清除缓存
    timing-clear: 180 # local定时清除过期缓存(单位秒),设置为0代表不执行
    type: blockPuzzle # 验证码类型 default 三种都实例化。blockPuzzle 滑块拼图、clickWord 文字点选、pictureWord 文本输入
    water-mark: 芋道源码 # 右下角水印文字(我的水印)，可使用 https://tool.chinaz.com/tools/unicode.aspx 中文转 Unicode，Linux 可能需要转 unicode
    interference-options: 0 # 滑动干扰项(0/1/2)
    req-frequency-limit-enable: false # 接口请求次数一分钟限制是否开启 true|false
    req-get-lock-limit: 5 # 验证失败 5 次，get接口锁定
    req-get-lock-seconds: 10 # 验证失败后，锁定时间间隔
    req-get-minute-limit: 30 # get 接口一分钟内请求数限制
    req-check-minute-limit: 60 # check 接口一分钟内请求数限制
    req-verify-minute-limit: 60 # verify 接口一分钟内请求数限制

--- #################### 消息队列相关 ####################

# rocketmq 配置项，对应 RocketMQProperties 配置类
rocketmq:
  # Producer 配置项
  producer:
    group: ${spring.application.name}_PRODUCER # 生产者分组

spring:
  # Kafka 配置项，对应 KafkaProperties 配置类
  kafka:
    # Kafka Producer 配置项
    producer:
      acks: 1 # 0-不应答。1-leader 应答。all-所有 leader 和 follower 应答。
      retries: 3 # 发送失败时，重试发送的次数
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer # 消息的 value 的序列化
    # Kafka Consumer 配置项
    consumer:
      auto-offset-reset: earliest # 设置消费者分组最初的消费进度为 earliest 。可参考博客 https://blog.csdn.net/lishuangzhe7047/article/details/74530417 理解
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
    # Kafka Consumer Listener 监听器配置
    listener:
      missing-topics-fatal: false # 消费监听接口监听的主题不存在时，默认会报错。所以通过设置为 false ，解决报错

--- #################### AI 相关配置 ####################

spring:
  ai:
    vectorstore: # 向量存储
      redis:
        initialize-schema: true
        index-name: knowledge_index # Redis 中向量索引的名称：用于存储和检索向量数据的索引标识符，所有相关的向量搜索操作都会基于这个索引进行
        prefix: "knowledge_segment:" # Redis 中存储向量数据的键名前缀：这个前缀会添加到每个存储在 Redis 中的向量数据键名前，每个 document 都是一个 hash 结构
      qdrant:
        initialize-schema: true
        collection-name: knowledge_segment # Qdrant 中向量集合的名称：用于存储向量数据的集合标识符，所有相关的向量操作都会在这个集合中进行
        host: 127.0.0.1
        port: 6334
      milvus:
        initialize-schema: true
        database-name: default # Milvus 中数据库的名称
        collection-name: knowledge_segment # Milvus 中集合的名称：用于存储向量数据的集合标识符，所有相关的向量操作都会在这个集合中进行
        client:
          host: 127.0.0.1
          port: 19530
    openai: # OpenAI 官方
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:sk-xxxx}
    azure: # OpenAI 微软
      openai:
        endpoint: https://eastusprejade.openai.azure.com
    anthropic: # Anthropic Claude
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:sk-xxxx}
    ollama:
      base-url: http://127.0.0.1:11434
      chat:
        model: llama3
    stabilityai:
      api-key: ${STABILITYAI_API_KEY:sk-xxxx}
    dashscope: # 通义千问
      api-key: ${DASHSCOPE_API_KEY:sk-xxxx}
    deepseek: # DeepSeek
      api-key: ${DEEPSEEK_API_KEY:sk-xxxx}
      chat:
        options:
          model: deepseek-v4-flash
    model:
      rerank: false # 是否开启“通义千问”的 Rerank 模型，填写 dashscope 开启
    mcp:
      server:
        enabled: false
        name: yudao-mcp-server
        version: 1.0.0
        instructions: 一个 MCP 示例服务
        sse-endpoint: /sse
      client:
        enabled: false
        name: mcp
        sse:
          connections:
            filesystem:
              url: http://127.0.0.1:8089
              sse-endpoint: /sse
        annotation-scanner:
          enabled: false # TODO @芋艿：有 bug https://github.com/spring-projects/spring-ai/issues/4917 需要官方修复

# 监控配置：Spring Boot Actuator + Micrometer Prometheus + OpenTelemetry (micrometer-tracing-bridge-otel)
# O3 修复：统一使用 OpenTelemetry 作为唯一链路追踪方案（已移除 SkyWalking 依赖）
# OTel 自动追踪 HTTP/DB/Redis/Kafka 调用链，上报至 Jaeger/Tempo
management:
  server:
    port: 48090 # 独立管理端口，避免与业务端口 48080 冲突，安全加固
    address: 127.0.0.1 # 仅本机可访问，防止生产环境 actuator 端点外泄
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics,tracing,modulith # 暴露核心端点 + Modulith 模块信息（beans/configprops/loggers 仅在 local/dev 环境暴露，见 application-local.yaml）
  endpoint:
    health:
      show-details: always # 显示健康检查详细信息
  # A5 指标导出:显式启用 Prometheus exporter,确保 Micrometer 指标可被 Prometheus 抓取
  metrics:
    export:
      prometheus:
        enabled: true # 显式启用 Prometheus 指标导出(虽 Spring Boot 默认启用,显式声明便于审计与配置可发现性)
    tags:
      application: ${spring.application.name} # 为所有指标添加 application 标签,便于 Grafana 按应用筛选
  # A4 OpenTelemetry 分布式追踪配置（micrometer-tracing-bridge-otel 桥接）
  tracing:
    sampling:
      probability: 1.0 # 采样率（生产环境建议 0.1，开发环境 1.0 全采样）
    propagation:
      type: w3c # 使用 W3C Trace Context 标准传播
    brave:
      supported-joined-spans: false
  # OTLP 上报端点（Jaeger 4318 / Tempo 4318）
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      timeout: 10s
  observations:
    annotations:
      enabled: true # 启用 @Observed 注解支持

# ---------- LLM 专用可观测性接入指引（P1-6）----------
# Spring AI 1.1+ 已自动为每次 ChatClient.call() 创建 Observation，
# 属性含 gen_ai.request.model / gen_ai.usage.prompt_tokens 等 OpenInference 语义约定。
# 这些 Observation 通过 micrometer-tracing-bridge-otel 自动转为 OTel Span，
# 经上述 otlp.tracing.endpoint 上报到后端。
#
# 接入 Langfuse（自托管，MIT，推荐用于 Prompt 版本管理 + Cost Attribution）：
#   1. docker-compose 启动 Langfuse（需 ClickHouse + PG + Redis，参考 https://langfuse.com/self-hosting/docker-compose）
#   2. Langfuse 提供 OTLP endpoint：http://langfuse-web:3000/api/public/otel
#   3. 修改 OTEL_EXPORTER_OTLP_ENDPOINT 环境变量指向 Langfuse：
#        export OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:3000/api/public/otel
#   4. 在 Langfuse 控制台创建 Project，将 PUBLIC_KEY 与 SECRET_KEY 配置为 OTLP HTTP Header（Basic Auth）
#   5. **不引入 Langfuse Java SDK**，纯 OTLP 桥接，避免代码侵入
#
# 接入 Arize Phoenix（更轻量，单容器 + SQLite，适合 PoC）：
#   docker run -p 6006:6006 arizephoenix/phoenix:latest
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:6006/v1/traces
#
# 当前默认：保持现有 Jaeger/Tempo OTLP endpoint（127.0.0.1:4318），LLM Span 与应用 Span 混在一起。
# 后续接入 Langfuse 时，可通过 environment variable 切换 endpoint，无需修改代码。

--- #################### Spring Modulith 配置（A3）####################

spring:
  modulith:
    detection-strategy: explicitly-annotated # 显式声明模块（package-info.java）
    events:
      jdbc:
        schema-initialization:
          enabled: false # 不自动创建事件发布表，避免影响启动
    observability:
      enabled: false # 关闭模块级可观测性（避免 ModuleTracingBeanPostProcessor NPE）

yudao:
  erp:
    golden-tax:
      enabled: false # 金税四期接口默认关闭，生产环境接入真实金税 SDK 并配置企业证书后开启
  ai:
    gemini: # 谷歌 Gemini
      enable: true
      api-key: ${GEMINI_API_KEY:sk-xxxx}
      model: gemini-2.5-flash
    doubao: # 字节豆包
      enable: true
      api-key: ${DOUBAO_API_KEY:sk-xxxx}
      model: doubao-seed-2-1-turbo-260628
    hunyuan: # 腾讯混元
      enable: true
      api-key: ${HUNYUAN_API_KEY:sk-xxxx}
      model: hy3-preview
    siliconflow: # 硅基流动
      enable: true
      api-key: ${SILICONFLOW_API_KEY:sk-xxxx}
      model: deepseek-ai/DeepSeek-V4-Pro
    xinghuo: # 讯飞星火
      enable: true
      api-key: ${XINGHUO_API_KEY:sk-xxxx}
      model: x2-flash
    baichuan: # 百川智能
      enable: true
      api-key: ${BAICHUAN_API_KEY:sk-xxxx}
      model: Baichuan-M3
    yiyan: # 文心一言
      enable: false
      api-key: ${YIYAN_API_KEY:sk-xxxx}
      model: ernie-5.1
    zhipu: # 智谱 AI（GLM）
      enable: false
      api-key: ${ZHIPU_API_KEY:sk-xxxx}
      model: glm-5.2
    minimax: # MiniMax
      enable: false
      api-key: ${MINIMAX_API_KEY:sk-xxxx}
      model: MiniMax-M3
    moonshot: # 月之暗面（KIMI）
      enable: false
      api-key: ${MOONSHOT_API_KEY:sk-xxxx}
      model: kimi-k2.6
    stepfun: # 阶跃星辰
      enable: false
      api-key: ${STEPFUN_API_KEY:sk-xxxx}
      model: step-3.7-flash
    grok: # Grok
      enable: false
      api-key: ${GROK_API_KEY:sk-xxxx}
      model: grok-4.3
    midjourney:
      enable: true
  #    base-url: https://api.holdai.top/mj-relax/mj
      base-url: https://api.holdai.top/mj
      api-key: ${MIDJOURNEY_API_KEY:sk-xxxx}
      notify-url: http://java.nat300.top/admin-api/ai/image/midjourney/notify
    suno:
      enable: true
  #    base-url: https://suno-55ishh05u-status2xxs-projects.vercel.app
      base-url: http://127.0.0.1:3001
    web-search:
      enable: true
      api-key: ${WEB_SEARCH_API_KEY:sk-xxxx}
    # ---------- AI 安全配置（Task 14，默认全部关闭，不影响现有行为）----------
    # 对应配置类：cn.iocoder.yudao.module.ai.config.AiSecurityConfiguration
    # 详细说明：.trae/specs/upgrade-tech-stack-and-ai-native/ai-security-audit.md
    security:
      token-limit: # SubTask 14.3：Token 用量限流，超限返回 429
        enabled: true # 启用 Token 限流（P0-2 验证）
        per-user-hour: 100000 # 每用户每小时 Token 上限（测试放大，避免影响正常测试）
        per-tenant-day: 1000000 # 每租户每天 Token 上限
        per-ip-minute: 10000 # 每 IP 每分钟 Token 上限
        bypass-roles: superadmin # 跳过限流的角色编码
      tool-access: # S14 修复：启用工具白名单，遵循默认拒绝原则
        whitelist-enabled: true
        whitelist: # 默认白名单：只读工具
          - "read*"
          - "query*"
          - "search*"
          - "get*"
          - "list*"
          - "page*"
          - "weather_query"
          - "directory_list"
          - "user_profile_query"
        blacklist: # 默认黑名单：危险写入/删除工具
          - "delete*"
          - "remove*"
          - "drop*"
        confirm-patterns: # 需要用户二次确认的工具
          - "update*"
          - "create*"
          - "save*"
        confirm-token-ttl-seconds: 300
      prompt-injection: # SubTask 14.2：LLM 提示词注入防护
        enabled: true # 启用提示词注入检测（P0-2 验证）
        patterns: # 危险模式正则黑名单
          - '(?i)(ignore|disregard).*(instruction|prompt|rule)'
          - '(?i)(you are|act as).*(admin|root|developer|system)'
          - '(?i)(rm\s+-rf|DROP\s+TABLE|DELETE\s+FROM|<script|javascript:)'
        action: warn # 命中处置策略：warn（告警，不阻断业务）/ block（拦截）
        alert-threshold-per-minute: 5 # 单用户每分钟告警阈值
      pii-mask: # SubTask 14.4：敏感数据脱敏（PII 识别与替换）
        enabled: true # 启用 PII 脱敏（P0-2 验证）
        mask-phone: true # 手机号脱敏 138****1234
        mask-id-card: true # 身份证脱敏 保留前6后4
        mask-email: true # 邮箱脱敏 a***@example.com
        mask-bank-card: true # 银行卡脱敏 保留后4
        rag-action: mask # RAG 入库命中 PII 处置：mask / reject

--- #################### 芋道相关配置 ####################

yudao:
  info:
    version: 1.0.0
    base-package: cn.iocoder.yudao
  web:
    admin-ui:
      url: http://dashboard.yudao.iocoder.cn # Admin 管理后台 UI 的地址
  xss:
    enable: true # 启用 XSS 防护（生产环境必须开启）
    exclude-urls: # 如下两个 url，仅仅是为了演示，去掉配置也没关系
      - ${spring.boot.admin.context-path}/** # 不处理 Spring Boot Admin 的请求
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  security:
    permit-all_urls:
      - /admin-api/mp/open/** # 微信公众号开放平台，微信回调接口，不需要登录
    totp:
      enabled: true # 是否启用 TOTP 双因素认证功能（仅对已绑定 TOTP 的用户生效）
  api-encrypt:
    enable: false # 是否开启 API 加密。默认关闭，避免低版本 JDK 8（8u120 以下）启动时 bcprov 的 JCE 认证报错
    algorithm: AES # 加密算法，支持 AES、RSA 等
    request-key: ${API_ENCRYPT_REQUEST_KEY:?required} # 请求加密的秘钥，必须 16、24、32 位（生产环境通过环境变量注入）
    response-key: ${API_ENCRYPT_RESPONSE_KEY:?required} # 响应加密的秘钥，AES，必须 16、24、32 位
#    request-key:  # 【RSA 案例】请求解密的私钥
#    response-key: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDh/CHyBcS/zEfVyINVA7+c9Xxl0CPdxPMK1OIjxaLy/7BLfbkoEpI8onQtjuzfpuxCraDem9bu3BMF0pMH95HytI3Vi0kGjaV+WLIalwgc2w37oA2sbsmKzQOP7SDLO5s2QJNAD7kVwd+Q5rqaLu2MO0xVv+0IUJhn83hClC0L5wIDAQAB # 【RSA 案例】响应加密的公钥
  websocket:
    enable: true # websocket的开关
    path: /infra/ws # 路径
    sender-type: local # 消息发送的类型，可选值为 local、redis、rocketmq、kafka、rabbitmq
    sender-rocketmq:
      topic: ${spring.application.name}-websocket # 消息发送的 RocketMQ Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 RocketMQ Consumer Group
    sender-rabbitmq:
      exchange: ${spring.application.name}-websocket-exchange # 消息发送的 RabbitMQ Exchange
      queue: ${spring.application.name}-websocket-queue # 消息发送的 RabbitMQ Queue
    sender-kafka:
      topic: ${spring.application.name}-websocket # 消息发送的 Kafka Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 Kafka Consumer Group
  swagger:
    title: 芋道快速开发平台
    description: 提供管理后台、用户 App 的所有功能
    version: ${yudao.info.version}
    url: ${yudao.web.admin-ui.url}
    email: xingyu4j@vip.qq.com
    license: MIT
    license-url: https://gitee.com/zhijiantianya/zhicloud_platform/blob/master/LICENSE
  mes:
    aps:
      algorithm: GREEDY # APS 排产算法：GREEDY(贪婪) / TOC_DBR(约束理论) / GENETIC(遗传算法)
  codegen:
    base-package: ${yudao.info.base-package}
    db-schemas: ${spring.datasource.dynamic.datasource.master.name}
    front-type: 20 # 前端模版的类型，参见 CodegenFrontTypeEnum 枚举类
    vo-type: 10 # VO 的类型，参见 CodegenVOTypeEnum 枚举类
    delete-batch-enable: true # 是否生成批量删除接口
    unit-test-enable: false # 是否生成单元测试
    import-enable: false # 是否生成 Excel 导入接口
  tenant: # 多租户相关配置项
    enable: true
    ignore-urls:
      - /jmreport/* # 积木报表，无法携带租户编号
    ignore-visit-urls:
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-tables:
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
      - iot:device
      - iot:thing_model_list
  sms-code: # 短信验证码相关的配置项
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: ${SMS_CODE_BEGIN:1000} # 验证码起始值（生产环境通过环境变量注入）
    end-code: ${SMS_CODE_END:9999} # 验证码结束值（生产环境通过环境变量注入）
  trade:
    order:
      pay-expire-time: 2h # 支付的过期时间
      receive-expire-time: 14d # 收货的过期时间
      comment-expire-time: 7d # 评论的过期时间
      status-sync-to-wxa-enable: true # 是否同步订单状态到微信小程序
    express:
      client: kd_100
      kd-niao:
        api-key: ${KD_NIAO_API_KEY:} # 快递鸟 API Key（必须通过环境变量注入，无默认值）
        business-id: ${KD_NIAO_BUSINESS_ID:}
        request-type: 1002 # 免费版 1002；付费版 8001
      kd100:
        key: ${KD100_KEY:} # 快递 100 Key（必须通过环境变量注入，无默认值）
        customer: ${KD100_CUSTOMER:}
  iot:
    message-bus:
      type: redis # 消息总线的类型
  audit-log: # 审计日志相关配置项（Hash 链式审计 + 独立文件存储）
    hash-chain:
      enabled: true # 是否启用 Hash 链式审计（启用后，每条操作日志会记录 prev_hash 和 current_hash，形成防篡改链）
    independent-storage:
      enabled: true # 是否启用独立文件存储（启用后，操作日志除写入 MySQL 外，还会以 JSONL 格式追加写入独立文件）
      path: ${AUDIT_LOG_PATH:logs/audit} # 独立存储路径（生产环境通过环境变量 AUDIT_LOG_PATH 注入；默认 logs/audit）

debug: false
