# Nacos config center profile
# 1. Default profile still uses local config (application-{dev,local,prod}.yaml)
# 2. Activate Nacos config center via -Dspring.profiles.active=nacos
# 3. Create yudao-server-{profile}.yaml in Nacos console
# 4. Nacos config overrides local config (higher priority for same keys)
yudao:
  config:
    nacos:
      enabled: true
      # Refresh whitelist (sensitive fields are not refreshed)
      refresh-whitelist:
        - yudao.security.xss.enable
        - yudao.web.cors.allowed-origins
        - spring.datasource.dynamic.datasource.master.url
        - spring.redis.host
