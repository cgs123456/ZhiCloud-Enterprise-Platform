--- #################### 生产环境覆盖配置 ####################
---
## 生产环境专用配置：覆盖 application.yaml 和 application-local.yaml 中的开发默认值
## 启用方式：SPRING_PROFILES_ACTIVE=prod 或 --spring.profiles.active=prod
## 所有敏感配置必须通过环境变量注入，不提供默认值
##
## 环境变量清单（必须配置）：
##   MASTER_DATASOURCE_URL          主库 JDBC URL
##   MASTER_DATASOURCE_USERNAME     主库用户名
##   MASTER_DATASOURCE_PASSWORD     主库密码
##   SLAVE_DATASOURCE_URL           从库 JDBC URL（可选）
##   SLAVE_DATASOURCE_USERNAME      从库用户名（可选）
##   SLAVE_DATASOURCE_PASSWORD      从库密码（可选）
##   REDIS_PASSWORD                 Redis 密码
##   MYBATIS_ENCRYPTOR_PASSWORD     MyBatis Plus 加密秘钥
##   API_ENCRYPT_REQUEST_KEY        API 请求加密秘钥（启用时必填）
##   API_ENCRYPT_RESPONSE_KEY       API 响应加密秘钥（启用时必填）
##   KD_NIAO_API_KEY                快递鸟 API Key（启用物流时必填）
##   KD_NIAO_BUSINESS_ID            快递鸟 Business ID（启用物流时必填）
##   KD100_KEY                      快递 100 Key（启用物流时必填）
##   KD100_CUSTOMER                 快递 100 Customer（启用物流时必填）
##   WX_MP_APP_ID / WX_MP_SECRET    微信公众号
##   WX_MINIAPP_APPID / WX_MINIAPP_SECRET  微信小程序
##   DINGTALK_CLIENT_ID / DINGTALK_CLIENT_SECRET  钉钉
##   WECHAT_ENTERPRISE_CLIENT_ID / WECHAT_ENTERPRISE_CLIENT_SECRET  企业微信
##   TENCENT_LBS_KEY                腾讯地图 Key
##   DRUID_USERNAME / DRUID_PASSWORD  Druid 监控页认证

server:
  port: 48080

--- #################### 数据源配置 ####################
spring:
  autoconfigure:
    # 该列表是整体替换 base 的同名列表，必须写全（见 application.yaml 的说明）。
    # prod 曾因漏掉 Qdrant/Milvus 而启动失败：两个自动配置都注册名为 vectorStore 的 bean。
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
      - org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  datasource:
    druid:
      stat-view-servlet:
        enabled: ${DRUID_ENABLED:false} # 生产环境默认关闭 Druid 监控页，需要时通过环境变量显式启用
        allow: 127.0.0.1
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:}
        login-password: ${DRUID_PASSWORD:}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 500
          merge-sql: true
        wall:
          config:
            multi-statement-allow: false
    dynamic:
      druid:
        # MySQL Connector/J 9.x：VERIFY_IDENTITY 需要显式 truststore；密码只从环境变量读取
        connection-properties:
          trustCertificateKeyStoreUrl: ${MYSQL_TLS_TRUSTSTORE_URL}
          trustCertificateKeyStorePassword: ${MYSQL_TLS_TRUSTSTORE_PASSWORD}
          trustCertificateKeyStoreType: ${MYSQL_TLS_TRUSTSTORE_TYPE:PKCS12}
        initial-size: 10
        min-idle: 10
        max-active: 100
        max-wait: 10000
        # 连接池健壮性配置：定期心跳检测，剔除失效连接，避免拿到已被数据库/防火墙断开的连接
        validation-query: "SELECT 1" # 检测连接是否有效的心跳 SQL
        test-while-idle: true # 借出连接前，若空闲超时则先校验有效性
        test-on-borrow: false # 不在每次借出时都校验（性能考虑，依赖 test-while-idle）
        keep-alive: true # 对空闲连接发送心跳，防止被防火墙静默断开
        min-evictable-idle-time-millis: 60000 # 连接最小空闲存活时间（1 分钟），超过可被回收
        time-between-eviction-runs-millis: 60000 # 检测线程执行间隔（1 分钟）
      primary: master
      datasource:
        master:
          url: ${MASTER_DATASOURCE_URL}
          username: ${MASTER_DATASOURCE_USERNAME}
          password: ${MASTER_DATASOURCE_PASSWORD}
        slave: # SLAVE 未配置时回退主库，读写分离需显式配置 SLAVE_DATASOURCE_URL
          lazy: true
          url: ${SLAVE_DATASOURCE_URL:${MASTER_DATASOURCE_URL}}
          username: ${SLAVE_DATASOURCE_USERNAME:${MASTER_DATASOURCE_USERNAME}}
          password: ${SLAVE_DATASOURCE_PASSWORD:${MASTER_DATASOURCE_PASSWORD}}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD}
      timeout: 5000 # 连接/命令超时（毫秒），避免 Redis 故障时业务线程长时间阻塞

--- #################### 监控配置 ####################
management:
  server:
    port: 48090 # 显式重申管理端口，避免被主配置覆盖
    # 安全加固说明：不再绑定 127.0.0.1（K8s kubelet 探针需要从 Pod IP 访问），生产环境建议用 NetworkPolicy 限制 48090 入站来源
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,tracing # 生产环境收敛端点，不暴露 beans/configprops/loggers/modulith
  endpoint:
    health:
      show-details: when_authorized # 生产环境不显示健康检查详情
  tracing:
    sampling:
      probability: 0.1 # 生产环境采样率降至 0.1，降低开销

--- #################### Flowable 配置 ####################
flowable:
  database-schema-update: false # 生产环境禁止自动 DDL，使用官方 SQL 脚本管理 schema
  db-history-used: true
  check-process-definitions: false
  history-level: audit

--- #################### 智云相关配置 ####################
zhicloud:
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost} # 生产环境 CORS 白名单，逗号分隔
  xss:
    enable: true # 生产环境必须启用 XSS 防护
  captcha:
    enable: true # 生产环境启用验证码
  security:
    mock-enable: false # 生产环境关闭 mock
    # OAuth2 Resource Server（对接外部 IdP 如 Keycloak/Auth0，默认关闭）
    # 启用前需在 pom.xml 显式添加 spring-boot-starter-oauth2-resource-server 依赖（security 模块中为 optional）
    # 详见 docs/oauth2-keycloak-guide.md
    oauth2:
      enabled: ${OAUTH2_ENABLED:false} # 默认关闭，按需启用
      jwk-set-uri: ${OAUTH2_JWK_SET_URI:} # Keycloak JWK Set URI，如 http://keycloak:8080/realms/zhicloud/protocol/openid-connect/certs
      issuer-uri: ${OAUTH2_ISSUER_URI:} # Keycloak Issuer URI，如 http://keycloak:8080/realms/zhicloud（与 jwk-set-uri 二选一）
      user-id-claim: sub # JWT 中用户 ID 的字段名
      tenant-id-claim: tenant_id # JWT 中租户 ID 的字段名
      authorities-claim: scope # JWT 中权限列表的字段名
  access-log:
    enable: true # 生产环境启用访问日志
  demo: false
  swagger:
    title: 智云快速开发平台
    description: 生产环境 API 文档
  # P2-5 数据湖仓模块（Iceberg + Trino），默认关闭，部署 Trino + MinIO 后通过 DATALAKE_ENABLED=true 启用
  datalake:
    enabled: ${DATALAKE_ENABLED:false}
    catalog-uri: ${DATALAKE_CATALOG_URI:http://trino:8080}
    warehouse-path: ${DATALAKE_WAREHOUSE_PATH:s3://zhicloud-warehouse}
    retention-days: ${DATALAKE_RETENTION_DAYS:365}
    archive-tables:
      - mes_pro_work_order      # 归档历史工单
      - wms_inventory_log       # 归档库存流水
      - erp_gl_voucher          # 归档历史凭证

--- #################### 日志配置 ####################
logging:
  file:
    name: ${LOG_FILE:/var/log/zhicloud-server/application.log}
  level:
    cn.zhicloud.module: info # 生产环境日志降为 info
    cn.zhicloud.module.*.dal.mysql: info # 显式覆盖 local/dev 中的 debug 配置，生产环境不打印 SQL
    root: info

--- #################### 微信公众号、小程序、第三方登录 ####################
## 说明：WxJava / JustAuth 的 starter 在装配 bean 时就要求 appid 非空，
##      prod profile 若完全不给这些占位配置，直接启动失败（appid不能设置为null），
##      即使客户根本没用微信。所以这里与 local 保持同一套配置结构，取值一律走环境变量。
wx:
  mp: # 公众号配置，参见 https://github.com/Wechat-Group/WxJava/blob/develop/spring-boot-starters/wx-java-mp-spring-boot-starter/README.md
    app-id: ${WX_MP_APP_ID:} # 公众号 AppID（通过环境变量注入）
    secret: ${WX_MP_SECRET:} # 公众号秘钥（通过环境变量注入）
    config-storage:
      type: RedisTemplate # 采用 RedisTemplate 操作 Redis，会自动从 Spring 中获取
      key-prefix: wx # Redis Key 的前缀
      http-client-type: HttpComponents # 采用 HttpComponents（HttpClient 5）请求微信公众号平台
  miniapp: # 小程序配置，参见 https://github.com/Wechat-Group/WxJava/blob/develop/spring-boot-starters/wx-java-miniapp-spring-boot-starter/README.md
    appid: ${WX_MINIAPP_APPID:} # 小程序 AppID（通过环境变量注入）
    secret: ${WX_MINIAPP_SECRET:} # 小程序秘钥（通过环境变量注入）
    config-storage:
      type: RedisTemplate
      key-prefix: wa
      http-client-type: HttpComponents

justauth:
  enabled: true
  type:
    DINGTALK: # 钉钉
      client-id: ${DINGTALK_CLIENT_ID:}
      client-secret: ${DINGTALK_CLIENT_SECRET:}
      ignore-check-redirect-uri: true
    WECHAT_ENTERPRISE: # 企业微信
      client-id: ${WECHAT_ENTERPRISE_CLIENT_ID:}
      client-secret: ${WECHAT_ENTERPRISE_CLIENT_SECRET:}
      agent-id: 1000004
      ignore-check-redirect-uri: true
    # noinspection SpringBootApplicationYaml
    WECHAT_MINI_PROGRAM: # 微信小程序
      client-id: ${wx.miniapp.appid}
      client-secret: ${wx.miniapp.secret}
      ignore-check-redirect-uri: true
      ignore-check-state: true # 微信小程序，不会使用到 state，所以不进行校验
    WECHAT_MP: # 微信公众号
      client-id: ${wx.mp.app-id}
      client-secret: ${wx.mp.secret}
      ignore-check-redirect-uri: true
  cache:
    type: REDIS
    prefix: 'social_auth_state:' # 缓存前缀，目前只对 Redis 缓存生效，默认 JUSTAUTH::STATE::
    timeout: 24h # 超时时长，目前只对 Redis 缓存生效，默认 3 分钟

--- #################### 消息队列 ####################
## IM / 站内信等依赖 RabbitMQ 转发 WebSocket 消息；未部署 MQ 时保持关闭，避免连 localhost。
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

--- #################### Spring Boot Admin 配置 ####################
spring:
  boot:
    admin:
      client:
        url: ${SBA_SERVER_URL:http://127.0.0.1:48080/admin}
        instance:
          service-host-type: IP
        username: ${SBA_USERNAME}
        password: ${SBA_PASSWORD}
      context-path: /admin
      frame-ancestors: "'self'"

--- #################### 接口文档配置 ####################
springdoc:
  api-docs:
    enabled: false # 生产环境关闭 API 文档
  swagger-ui:
    enabled: false # 生产环境关闭 Swagger UI

knife4j:
  enable: false # 生产环境关闭 Knife4j

--- #################### 验证码相关配置 ####################
aj:
  captcha:
    type: blockPuzzle # 生产环境使用滑块拼图验证码
    req-frequency-limit-enable: true # 生产环境开启接口请求频率限制

--- #################### MyBatis 字段加解密配置 ####################
# 生产环境强制要求通过环境变量注入 MyBatis-Plus 字段加解密秘钥（与 application.yaml 对齐，prod profile 显式覆盖）
mybatis-plus:
  encryptor:
    password: ${MYBATIS_ENCRYPTOR_PASSWORD:?required}
