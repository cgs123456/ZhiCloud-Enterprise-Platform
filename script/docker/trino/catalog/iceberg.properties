# Trino Iceberg Catalog 配置
# 指向 MinIO（S3 兼容存储）作为 Iceberg 表数据的物理存储后端
#
# P2-5 数据湖仓基础架构
# 启用方式：将此文件挂载到 Trino 容器的 /etc/trino/catalog/ 目录
# docker-compose.yml 中已配置：./trino/catalog:/etc/trino/catalog:ro

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181

# S3 兼容存储配置（MinIO）
iceberg.rest-catalog.warehouse=s3://zhicloud-warehouse
iceberg.rest-catalog.s3.endpoint=http://zhicloud-minio:9000
iceberg.rest-catalog.s3.region=us-east-1
iceberg.rest-catalog.s3.path-style-access=true
iceberg.rest-catalog.s3.access-key=minioadmin
iceberg.rest-catalog.s3.secret-key=minioadmin123

# 文件格式默认 Parquet
iceberg.file-format=PARQUET
