server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://yudao-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: yudao-server
    static_configs:
      - targets:
          - localhost
        labels:
          job: yudao-server
          __path__: /var/log/yudao-server/*.log
    pipeline_stages:
      # 提取 traceId（logback Pattern 中的 [%X{traceId:-}]）
      - regex:
          expression: '\[(?P<traceId>[a-f0-9-]+)\] \[(?P<tenantId>[^\]]*)\]'
      - labels:
          traceId:
          tenantId:
