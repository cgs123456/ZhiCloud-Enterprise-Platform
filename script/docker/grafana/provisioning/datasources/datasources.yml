# Grafana 数据源自动配置（E1）
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://zhicloud-prometheus:9090
    isDefault: true
    editable: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://zhicloud-jaeger:16686
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://zhicloud-loki:3100
    editable: true
    jsonData:
      maxLines: 1000
