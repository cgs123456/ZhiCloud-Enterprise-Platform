# yudao-server K8s 部署清单
# 包含：ConfigMap + Secret + Deployment + Service + HPA + Ingress + PDB + NetworkPolicy
# N4 修复：补齐 K8s 部署 yaml，支持容器编排平台部署

# ============================================================
# ConfigMap：应用非敏感配置（数据源、Redis、RAG、OTel 等）
# 通过 envFrom.configMapRef 注入到容器环境变量
# ============================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yudao-server-config
  namespace: default
  labels:
    app: yudao-server
data:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_OPTS: "-Xms512m -Xmx512m -XX:+UseZGC -XX:+ZGenerational -Djava.security.egd=file:/dev/./urandom"
  # 数据源
  MASTER_DATASOURCE_URL: "jdbc:mysql://yudao-mysql:3306/zhicloud_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
  MASTER_DATASOURCE_USERNAME: "root"
  SLAVE_DATASOURCE_URL: "jdbc:mysql://yudao-mysql:3306/zhicloud_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
  SLAVE_DATASOURCE_USERNAME: "root"
  # Redis
  REDIS_HOST: "yudao-redis"
  REDIS_PORT: "6379"
  # RAG
  YUDAO_AIRAG_ENABLED: "true"
  YUDAO_AIRAG_DATASOURCE_URL: "jdbc:postgresql://yudao-postgres:5432/yudao_rag"
  YUDAO_AIRAG_DATASOURCE_USERNAME: "yudao"
  # OTel
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://yudao-jaeger:4318/v1/traces"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://yudao-jaeger:4318/v1/traces"

# ============================================================
# Secret：敏感配置（密码、加密密钥等）
#
# 【安全策略】本清单刻意不包含 Secret 资源。
#
# 原因：此前这里内联了 9 个 "CHANGE_ME_IN_PRODUCTION" 明文占位符，
# `kubectl apply -f` 会成功创建这些假密码，Pod 也能起来，
# 于是"忘了改密码"不会有任何报错，直到出事才被发现。
#
# 现在改为：Secret 必须在 apply 本清单之前由外部体系单独创建。
# 若 Secret 不存在，下方 Deployment 的 envFrom.secretRef 会让 Pod
# 停在 CreateContainerConfigError，部署明确失败——fail-closed。
#
# 创建方式（三选一，按推荐顺序）：
#
#   1) External Secrets Operator / Sealed Secrets / SOPS（生产推荐）
#      由密钥管理系统（Vault、AWS Secrets Manager 等）同步生成
#      名为 yudao-server-secret 的 Secret。
#
#   2) 从环境变量创建（CI 场景）
#      kubectl create secret generic yudao-server-secret \
#        --from-literal=MASTER_DATASOURCE_PASSWORD="$MASTER_DATASOURCE_PASSWORD" \
#        --from-literal=SLAVE_DATASOURCE_PASSWORD="$SLAVE_DATASOURCE_PASSWORD" \
#        --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
#        --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#        --from-literal=MYBATIS_ENCRYPTOR_PASSWORD="$MYBATIS_ENCRYPTOR_PASSWORD" \
#        --from-literal=API_ENCRYPT_REQUEST_KEY="$API_ENCRYPT_REQUEST_KEY" \
#        --from-literal=API_ENCRYPT_RESPONSE_KEY="$API_ENCRYPT_RESPONSE_KEY" \
#        --from-literal=DRUID_USERNAME="druid" \
#        --from-literal=DRUID_PASSWORD="$DRUID_PASSWORD" \
#        --from-literal=SBA_PASSWORD="$SBA_PASSWORD"
#
#   3) 使用 Helm Chart 部署（deploy/helm/yudao）
#      Chart 内置渲染期校验，空值或 CHANGE_ME 前缀会让 helm 直接失败。
#
# 必需的键（缺一不可）：
#   MASTER_DATASOURCE_PASSWORD、SLAVE_DATASOURCE_PASSWORD、REDIS_PASSWORD、
#   POSTGRES_PASSWORD、MYBATIS_ENCRYPTOR_PASSWORD、API_ENCRYPT_REQUEST_KEY、
#   API_ENCRYPT_RESPONSE_KEY、DRUID_USERNAME、DRUID_PASSWORD、SBA_PASSWORD
# ============================================================

# ============================================================
# Deployment：后端服务部署
# 通过 envFrom 引用上方 ConfigMap 与 Secret
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yudao-server
  labels:
    app: yudao-server
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yudao-server
  template:
    metadata:
      labels:
        app: yudao-server
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: yudao-server
          image: yudao-server:2026.06.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 48080
              protocol: TCP
            - name: actuator
              containerPort: 48090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: yudao-server-config
            - secretRef:
                name: yudao-server-secret
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 48090
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 48090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 优雅停机：preStop 先 sleep 10s 等待 Service 摘流量，再由 Spring Boot graceful shutdown 处理进行中请求
          # terminationGracePeriodSeconds=60 保证总等待不超过 60s（preStop 10s + Spring graceful 30s + 缓冲 20s）
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 10"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      terminationGracePeriodSeconds: 60

# ============================================================
# Service：暴露后端服务端口（HTTP 48080 / Actuator 48090）
# ============================================================
---
apiVersion: v1
kind: Service
metadata:
  name: yudao-server
  labels:
    app: yudao-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 48080
      targetPort: 48080
      protocol: TCP
    - name: actuator
      port: 48090
      targetPort: 48090
      protocol: TCP
  selector:
    app: yudao-server

# ============================================================
# HorizontalPodAutoscaler：根据 CPU/内存使用率自动伸缩 (2~10 副本)
# ============================================================
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yudao-server
  labels:
    app: yudao-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yudao-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# ============================================================
# Ingress：外部流量入口，启用 TLS 终结
# TLS 证书由 yudao-tls-secret 提供（需提前通过 cert-manager 或 kubectl create secret tls 创建）
# ============================================================
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yudao-server
  labels:
    app: yudao-server
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.yudao.example.com
      secretName: yudao-tls-secret
  rules:
    - host: api.yudao.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yudao-server
                port:
                  number: 48080

# ============================================================
# PodDisruptionBudget：保证自愿驱逐期间至少保留 1 个可用副本
# 用于维护节点 / 排空时保障服务连续性
# ============================================================
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: yudao-server-pdb
  namespace: default
  labels:
    app: yudao-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: yudao-server

# ============================================================
# NetworkPolicy：限制 yudao-server Pod 的入站与出站流量
# - Ingress：仅允许任意命名空间访问 48080(HTTP) / 48090(Actuator)
# - Egress：允许访问 MySQL(3306) / Redis(6379) / Postgres(5432)
#           允许访问外部 80/443/4318(OTel)
# 注意：依赖依赖组件 Pod 已打上对应 app 标签才能命中 egress 规则
# ============================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yudao-server-netpol
  namespace: default
  labels:
    app: yudao-server
spec:
  podSelector:
    matchLabels:
      app: yudao-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 48080
        - protocol: TCP
          port: 48090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: yudao-mysql
        - podSelector:
            matchLabels:
              app: yudao-redis
        - podSelector:
            matchLabels:
              app: yudao-postgres
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4318
